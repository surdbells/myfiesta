# Local development services.
#
#   docker compose up -d
#
# Postgres is not optional for this project. The schema uses generated columns,
# partial unique indexes, check constraints, and an append-only trigger; SQLite
# supports none of it, so tests run against a real server here and in CI.
services:
  postgres:
    image: postgres:17
    container_name: myfiesta-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myfiesta_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: myfiesta-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
