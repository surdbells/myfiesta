# Everything that has to be running for this platform to work.
#
#   docker compose --env-file .env.production --env-file .env.release \
#     -f ops/docker/compose.prod.yml up -d
#
# .env.release is one line, TAG=<the release to run>, rewritten by every
# release and rollback (docs/OPERATIONS.md). Every image is that tag and no
# other: there is no "latest" to fall back on, so a command that was not told
# which release is running stops here rather than starting an older build.
#
# Host-agnostic on purpose: it runs on one box, and it is a readable statement
# of what any other arrangement — Kubernetes, ECS, a platform-as-a-service —
# has to provide. The two processes people forget are here first, because
# forgetting them is silent: without the worker no email ever sends, and
# without the scheduler abandoned baskets hold stock until an event reads as
# sold out that nobody bought.
#
# Postgres and Redis are deliberately not here. A managed database with
# backups somebody else tests is worth more than a container on the same host
# as the application; point DB_HOST and REDIS_HOST at it. Where there is none
# to point at — one VPS, behind aaPanel's nginx — compose.contabo.yml adds
# both beside the application (docs/RUNBOOK-CONTABO-AAPANEL.md).
#
# Every port is published on this host's loopback unless told otherwise:
# Docker's published ports go around the host's firewall (ufw included), so a
# port on 0.0.0.0 is open to the internet whatever the firewall says. Whatever
# terminates TLS on this host reaches them on 127.0.0.1.

name: myfiesta

x-api: &api
  build:
    context: ../..
    dockerfile: ops/docker/api.Dockerfile
    # The release is the tag: baked into the image for Sentry and the backup
    # manifests, so rolling back to an older tag rolls back what errors say too.
    args:
      RELEASE: ${TAG:?set TAG in .env.release to the release to run}
  image: myfiesta/api:${TAG:?set TAG in .env.release to the release to run}
  env_file: [../../.env.production]
  restart: unless-stopped
  # The parts the API answers for: the database, the cache and both disks
  # (docs/OPERATIONS.md). The worker and the scheduler replace this with their
  # own part, so each container is unhealthy for its own reason.
  healthcheck:
    test: ["CMD", "php", "artisan", "app:health", "--only=database,cache,storage"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 30s
  volumes:
    # Private files: identity documents, data exports. On a volume so a
    # redeploy does not take somebody's export with it, and never in the image.
    - api-storage:/var/www/api/storage/app
    # Uploaded pictures (MEDIA_DISK=local), on a volume of their own so that
    # nginx can be given them without being given the private files above.
    - api-media:/var/www/api/storage/app/public
  depends_on:
    api-migrate:
      condition: service_completed_successfully

services:
  # Runs once per deploy, before anything serves. A container that starts
  # against a schema it does not match is the worst five minutes of a release.
  #
  # It checks production is fit to run (app:preflight) before anything else,
  # so a deployment with a secret missing or a sender pretending stops here,
  # with the list, before the schema is touched. Said in the command because
  # the image's entrypoint checks only in front of what serves: everything
  # else it runs has to work on a box that is being put right.
  #
  # The caches it builds are thrown away with it — each container has its
  # own filesystem, and api, worker and scheduler build their own as they
  # start (ops/docker/api-entrypoint.sh). They are built here as well so a
  # release that cannot cache stops before any of those is replaced.
  api-migrate:
    build:
      context: ../..
      dockerfile: ops/docker/api.Dockerfile
      args:
        RELEASE: ${TAG:?set TAG in .env.release to the release to run}
    image: myfiesta/api:${TAG:?set TAG in .env.release to the release to run}
    env_file: [../../.env.production]
    command: >
      sh -c "php artisan app:preflight
      && php artisan migrate --force
      && php artisan config:cache
      && php artisan route:cache
      && php artisan event:cache"
    restart: "no"

  api:
    <<: *api

  # The one that sends every email this platform sends.
  worker:
    <<: *api
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
    # A worker is not a web server: it must finish the job in its hands before
    # it goes, or somebody's tickets are minted and never sent.
    stop_grace_period: 90s
    # Healthy while jobs are being taken off the queue: the heartbeat the
    # scheduler sends every minute has been run, and jobs are not failing in
    # bulk. So it also goes unhealthy when the scheduler stops sending.
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--only=queue"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  # Six commands matter and all of them are in here — see apps/api/README.md.
  # schedule:work runs in the foreground, which is what a container wants;
  # cron is the arrangement on a host without one.
  scheduler:
    <<: *api
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--only=scheduler"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    # The nightly backup runs here (backup:run). With BACKUP_TARGET=volume it
    # is written to api-backups — on this host, which is better than nothing
    # and not off-site; BACKUP_TARGET=s3 is. Listed in full because a service's
    # volumes replace the anchor's rather than adding to them.
    volumes:
      - api-storage:/var/www/api/storage/app
      - api-media:/var/www/api/storage/app/public
      - api-backups:/var/backups/myfiesta

  api-web:
    # Its own image: the API's public files (the admin panel's scripts and
    # styles) are in it, and so is the step that reads TRUSTED_PROXIES.
    build:
      context: ../..
      dockerfile: ops/docker/api-web.Dockerfile
    image: myfiesta/api-web:${TAG:?set TAG in .env.release to the release to run}
    restart: unless-stopped
    environment:
      # Not optional. The addresses the load balancer connects from: only they
      # may say who the client is, or that it was https. The API reads the same
      # variable from .env.production.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set the addresses the load balancer connects from}
    # The uploaded pictures it serves at /storage/, read-only. Only these:
    # identity documents and exports stay on api-storage, which this
    # container never sees.
    volumes:
      - api-media:/var/www/api/storage/app/public:ro
    depends_on: [api]
    # Liveness through the whole web path: nginx, php-fpm and the framework,
    # without the database. Whether the platform can take an order is
    # /api/health/ready, for the uptime monitor (docs/OPERATIONS.md).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # On this host's loopback unless API_BIND says otherwise. A load balancer
    # on this host reaches it through Docker's proxy and arrives from the
    # network's gateway, which is why TRUSTED_PROXIES names the gateway then.
    # But anything else that comes in through that proxy arrives from the
    # gateway too — a visitor over IPv6, when this network has only IPv4 —
    # and would be believed about its own address and about https. So the
    # gateway is only ever trusted with the port on loopback. A balancer on
    # another machine means API_BIND=0.0.0.0 and the balancer's own address
    # in TRUSTED_PROXIES, never the gateway.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:80"

  site:
    build:
      context: ../..
      dockerfile: ops/docker/web.Dockerfile
      args:
        RELEASE: ${TAG:?set TAG in .env.release to the release to run}
    image: myfiesta/web:${TAG:?set TAG in .env.release to the release to run}
    restart: unless-stopped
    environment:
      # Not optional. Angular refuses to render for an unrecognised Host and
      # falls back to client rendering without saying so, which is a shared
      # link unfurling as nothing.
      ALLOWED_HOSTS: ${SITE_HOSTS:?set the hostnames this site answers to}
      API_BASE_URL: ${API_BASE_URL:?set the public API address}
      CONSOLE_URL: ${CONSOLE_URL:?set the console address}
      PUBLIC_URL: ${PUBLIC_URL:?set this site's own address}
      # The phone app's store listings. Empty hides the store buttons.
      APP_STORE_URL: ${APP_STORE_URL:-}
      PLAY_STORE_URL: ${PLAY_STORE_URL:-}
      # Where browser errors are reported. Empty reports nothing.
      SENTRY_DSN: ${SITE_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    # Loopback, like the API: the TLS in front of it is on this host. It used
    # to be every interface, which put an http copy of the site on port 4000
    # of the public address, past the firewall. SITE_BIND=0.0.0.0 only for a
    # load balancer on another machine.
    ports:
      - "${SITE_BIND:-127.0.0.1}:${SITE_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/robots.txt || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  console:
    build:
      context: ../..
      dockerfile: ops/docker/console.Dockerfile
      args:
        RELEASE: ${TAG:?set TAG in .env.release to the release to run}
    image: myfiesta/console:${TAG:?set TAG in .env.release to the release to run}
    restart: unless-stopped
    environment:
      # Stamped into index.html at start-up by the image's entrypoint, which
      # refuses to start without them rather than serving a console that calls
      # localhost.
      API_BASE_URL: ${API_BASE_URL:?set the public API address}
      PUBLIC_URL: ${PUBLIC_URL:?set the public site address}
      # Where console errors are reported; stamped like the two above, and
      # written into the policy. Empty reports nothing.
      SENTRY_DSN: ${CONSOLE_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    # Loopback for the same reason as the site. CONSOLE_BIND=0.0.0.0 only for
    # a load balancer on another machine.
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-4310}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  api-storage:
  # Posters, logos and gallery pictures when MEDIA_DISK=local. Unused, and
  # harmless, when the pictures live in a bucket.
  api-media:
  # Nightly database backups when BACKUP_TARGET=volume. On this host, so not
  # off-site: see docs/OPERATIONS.md.
  api-backups:
