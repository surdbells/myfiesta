# Nginx in front of php-fpm.
#
# Two things here are unusual. The body size: a signed payment webhook and an
# identity document both have to get through, and a 413 on the first is an
# order that never becomes paid. And who is believed about the client, below.

# Whether this connection came from the load balancer.
#
# X-Forwarded-For and X-Forwarded-Proto are headers, and anybody can send a
# header. This used to believe them from every address: a client could name
# its own address — every per-address limit here, guessing passwords included,
# undone by a line of curl — and any X-Forwarded-Proto at all, "http"
# included, made PHP call the request https.
#
# Now they are believed only from the addresses in TRUSTED_PROXIES, the same
# list Laravel reads (config/trustedproxy.php). The container writes it into
# the two files included here as it starts (api-web-entrypoint.sh), and will
# not start without it.
geo $realip_remote_addr $from_trusted_proxy {
    default 0;
    include /etc/nginx/trusted-proxies.geo;
}

# https, when the load balancer says so, and only then. A client reaching this
# port some other way is plain http whatever it claims.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_https {
    default "";
    "1:https" on;
}

# Insisting on https is only worth saying over https; empty means not sent.
map $forwarded_https $strict_transport {
    on "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /var/www/api/public;
    index index.php;

    client_max_body_size 16M;

    # The client's own address, from the load balancer's X-Forwarded-For —
    # the last address in it that is not one of ours, so an entry the client
    # wrote in front is never the one taken. From anybody else the header is
    # ignored and the address is the connection's. This is the address PHP is
    # handed as REMOTE_ADDR, and so the one every rate limit counts.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/trusted-proxies.realip;

    # Nothing about the server, to anybody.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # Files served straight from disk: the admin panel's scripts, styles
        # and fonts. Whatever PHP answers carries these from SecurityHeaders
        # instead, so they are here and not on the server, where they would be
        # sent twice.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security $strict_transport always;
    }

    # --- uploaded pictures (MEDIA_DISK=local) ---------------------------------
    #
    # Posters, logos and gallery pictures, at the address the API hands out:
    # APP_URL/storage/... They live on the api-media volume, which the API
    # writes and this container mounts read-only — this image has no copy of
    # storage/ and no storage:link symlink, so before this block every picture
    # request fell through to PHP and came back 404.
    #
    # ^~ so no regex location below gets a say: nothing under here is ever
    # handed to PHP, whatever its name ends in. Every file is named afresh
    # when written, so a year's cache cannot show anybody an old picture.
    # With MEDIA_DISK=s3 the addresses point at the bucket and this is unused.
    #
    # The year is for pictures that were found, so no `always` on it. A 404
    # given that header would be kept for a year by browsers and any CDN, and
    # there are times every picture 404s for a while — the first deployment
    # before storage/app/public is copied into api-media, or this container
    # started without the mount — and the pictures would stay broken for
    # whoever looked then, long after the files were back.
    location ^~ /storage/ {
        alias /var/www/api/storage/app/public/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        location ~ /\. {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # "on" or not set at all. It used to be the header's own value, and PHP
        # counts any value but "off" as https — "http" included.
        fastcgi_param HTTPS $forwarded_https if_not_empty;

        # A long export or a slow gateway call should not be cut off mid-flight.
        fastcgi_read_timeout 120s;
    }

    # Dotfiles, and the ones that matter: .env is in the image's parent
    # directory, but a misconfiguration that put it here would otherwise serve
    # every credential this platform has.
    location ~ /\. {
        deny all;
    }
}
