# Nginx in front of php-fpm.
#
# The only unusual line here is the body size: a signed payment webhook and an
# identity document both have to get through, and a 413 on the first is an
# order that never becomes paid.

server {
    listen 80;
    server_name _;
    root /var/www/api/public;
    index index.php;

    client_max_body_size 16M;

    # Told the truth about the client by whatever terminates TLS. Laravel needs
    # it to build https URLs and to rate limit by the right address rather than
    # by the proxy's.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Nothing about the server, to anybody.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;

        # A long export or a slow gateway call should not be cut off mid-flight.
        fastcgi_read_timeout 120s;
    }

    # Dotfiles, and the ones that matter: .env is in the image's parent
    # directory, but a misconfiguration that put it here would otherwise serve
    # every credential this platform has.
    location ~ /\. {
        deny all;
    }
}
