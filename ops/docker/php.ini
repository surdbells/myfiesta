; Production PHP, for the container that takes money.
;
; Everything here is a decision somebody would otherwise make by accident on a
; new host.

; Never to a buyer. A stack trace on a checkout page is a map of the
; application and, often, of its configuration.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Tickets are images and identity documents are photographs, both of which
; arrive from a phone camera at sizes nobody expects.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M

; Long enough for an export of a large night, short enough that a stuck
; request frees its worker.
max_execution_time = 60

; Opcache, with the file check off: the code in this image does not change
; while it runs, and checking timestamps on every request is work for nothing.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; The dates on every ticket are rendered in the venue's zone from an instant.
; The server's own zone should never come into it, and UTC makes that obvious
; if it ever does.
date.timezone = UTC

; A session cookie that a script can read is a session cookie somebody else
; can steal. Nothing here needs JavaScript to see it.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
