# Static files, with one rule that matters: every unknown path is the app.
#
# And the headers every response carries, set once on the server and never in
# a location. nginx drops the server's add_header lines from any location that
# has one of its own, and index.html used to have its own Cache-Control — so
# the console itself, which is index.html at every address, went out with no
# frame protection at all. What differs by path is chosen by the maps below
# instead.

# The API's origin, for the policy: written as the container starts
# (console-entrypoint.sh), from API_BASE_URL, into conf.d/00-console-origin.conf.
# Without it nginx does not start, rather than start with a policy that stops
# the console reaching its API.

# Built files are named by their contents, so a year costs nothing and saves a
# round trip on every visit. index.html is never cached: it carries the
# addresses stamped in at start-up, and a cached copy is a console still
# calling the previous deployment's API.
map $uri $console_cache_control {
    /index.html "no-store";
    "~*\.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$" "public, immutable";
    default "";
}

# What the console may load, and from where.
#
#   script-src    its own bundles, and 'wasm-unsafe-eval' for the door's QR
#                 decoder, which is WebAssembly compiled in the page. Nothing
#                 inline: the build does not inline critical CSS (angular.json)
#                 because that loads the rest with an onload handler.
#   style-src     inline allowed: Angular writes component styles into the page.
#   img-src       posters are on the API's disk or in a bucket only the API
#                 knows the address of, so any https address.
#   connect-src   the API, and nothing else.
#   worker-src    the service worker that keeps the console open offline.
#
# The service worker is governed by the policy it was served with, and every
# request the console makes passes through it — the pictures included, which
# it fetches itself — so it may fetch from any https address as well.
map $uri $console_policy {
    "~^/(ngsw-worker|safety-worker|worker-basic\.min)\.js$" "default-src 'self'; connect-src 'self' $console_api_origin https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: $console_api_origin; font-src 'self' data:; connect-src 'self' $console_api_origin; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Insisting on https only when the load balancer says it was https. A client
# lying about that only fools itself: a browser ignores the header over http.
map $http_x_forwarded_proto $console_strict_transport {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Nothing in here is meant to be framed by anybody. The camera is the
    # door's; nothing else here wants a sensor or a payment sheet.
    add_header Content-Security-Policy $console_policy always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security $console_strict_transport always;
    add_header Cache-Control $console_cache_control;

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # The router owns the paths. Anything not on disk is the application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
