# Static files, with one rule that matters: every unknown path is the app.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Content-hashed by the build, so a year costs nothing and saves a round
    # trip on every visit.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cached: it carries the addresses stamped in at start-up, and a
    # cached copy is a console still calling the previous deployment's API.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The router owns the paths. Anything not on disk is the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing in here is meant to be framed by anybody.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
