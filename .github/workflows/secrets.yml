name: Secret scan

on:
  push:
  pull_request:

# The platform this replaces shipped a live Stripe secret key inside its mobile
# bundle, and kept the database password, both Stripe key pairs, and the mail
# API key in source. This job exists so that cannot happen twice — it runs on
# every push, and it is not optional.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so a secret cannot be buried in an older commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
