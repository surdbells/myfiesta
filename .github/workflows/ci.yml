name: CI

on:
  push:
    branches: [main]
  pull_request:

# Path filtering is what keeps a one-line change to the phone app from running
# PHPUnit. Small enough to route by hand; a build tool for it would be the
# larger thing to maintain.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      organizer: ${{ steps.filter.outputs.organizer }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contract: ${{ steps.filter.outputs.contract }}
      tokens: ${{ steps.filter.outputs.tokens }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Every package an app reads is compiled as source by that app, or
            # read by its tests, and checked only through it — packages/door is
            # the camera and what a door decides with no signal, and the door's
            # hash fixture in packages/contract is one the console and the API
            # must both reproduce. tools/check-ci-filters.cjs fails when a
            # filter leaves one out. The three Angular apps install from the
            # one lockfile at the root, so a change to it is a change to each.
            # The API's mirror tests read the site: the refund policy and checkout
            # wording it keeps a copy of (LegalCopiesTest) and the route words
            # events may not take as a slug (ReservedSlugMirrorTest).
            api:        ['apps/api/**', 'packages/contract/**', 'packages/api-types/**', 'apps/web/src/app/features/info/**', 'apps/web/src/app/features/checkout/**', 'apps/web/src/app/app.routes.ts']
            web:        ['apps/web/**', 'packages/tokens/**', 'packages/ui/**', 'packages/shared/**', 'package.json', 'package-lock.json']
            organizer:  ['apps/organizer-web/**', 'packages/tokens/**', 'packages/door/**', 'packages/ui/**', 'packages/shared/**', 'packages/api-types/**', 'packages/contract/**', 'package.json', 'package-lock.json']
            mobile:     ['apps/mobile/**', 'packages/tokens/**', 'packages/door/**', 'packages/shared/**', 'packages/api-types/**', 'package.json', 'package-lock.json']
            contract:   ['packages/contract/**']
            tokens:     ['packages/tokens/**']
            # Everything the images copy. All four build from the root, so
            # .dockerignore decides what of it reaches each one. And the
            # example that stands in for .env.production when the compose
            # file is checked.
            docker:     ['ops/docker/**', '.dockerignore', '.env.production.example', 'apps/api/**', 'apps/web/**', 'apps/organizer-web/**', 'packages/**', 'package.json', 'package-lock.json']

  tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Regenerates and fails if the committed output drifted. Every client
      # reads the same generated CSS, so a token change cannot land on one
      # surface and not another.
      - run: node packages/tokens/build.mjs
      - run: git diff --exit-code -- packages/tokens/dist
      # The two beside the generator, which were never run here: every pairing
      # legible in both themes, every var() resolving, and nothing painting
      # with a colour of its own.
      - run: node packages/tokens/contrast.mjs
      - run: node packages/tokens/usage.mjs

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npx --yes @redocly/cli@latest lint packages/contract/openapi.yaml

  # What one file assumes about another. None of these build anything; they
  # read, compare, and fail with the name of the file to fix.
  agreements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # The addresses each app is told at run time, and whatever is supposed
      # to write them in. A tag nothing fills is a link pointing at localhost
      # in production.
      - run: node tools/check-runtime-config.cjs
      # Capacitor plugins installed against the ones each native project
      # actually links. One that is not linked never fails; the feature that
      # needed it simply does nothing on a device.
      - run: node tools/check-native-plugins.cjs
      # The phone app's version and build number, written once in
      # apps/mobile/package.json, against both native projects. A store
      # refuses a build number it has seen, and nothing else would say so
      # until the upload.
      - run: node tools/stamp-mobile-version.cjs --check
      # The path filters above against what each app reads out of packages/.
      # A package a filter leaves out is a change to it that runs none of the
      # builds or tests using it, and still comes back green.
      - run: node tools/check-ci-filters.cjs

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myfiesta_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, gd, intl
          coverage: none
      - run: composer install --prefer-dist --no-progress
      # Formatting, first because it fails in seconds: ./vendor/bin/pint in apps/api puts it right.
      - run: ./vendor/bin/pint --test
      - run: cp .env.example .env && php artisan key:generate
      # Static analysis: phpstan.neon says what it looks for and why, and
      # `composer analyse` is the same run on a laptop. PHPStan's own result
      # cache is carried from one run to the next, so it reads again only
      # what changed; it notices a changed config or lockfile by itself.
      - uses: actions/cache@v6
        with:
          path: apps/api/storage/framework/cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-
      - run: composer analyse -- --no-progress --error-format=github
      # Every value the services here differ on, named rather than inherited.
      # .env.example describes the developer stack in compose.yaml, where
      # Postgres is on 15432 and Redis on 56379 to stay clear of Windows'
      # ephemeral range; a service container publishes the ordinary ports. A
      # port left unset falls through to the file and points at nothing.
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: myfiesta_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # The two web apps install the way the phone app does, from the workspace
  # root. There is one lockfile, beside the root package.json; the ones these
  # jobs used to name, inside each app, do not exist.
  #
  # Their specs run in jsdom, as they do locally. --browsers=ChromeHeadless was
  # a Karma flag; the unit-test builder reads it as a request for Vitest's
  # browser mode, which needs a browser provider no app installs, so the step
  # could only fail.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm test --workspace web -- --watch=false

  organizer-web:
    needs: changes
    if: needs.changes.outputs.organizer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run build --workspace organizer-web
      - run: npm test --workspace organizer-web -- --watch=false

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: package-lock.json }
      - run: bash tools/check-feature-boundaries.sh
      # Installed from the workspace root: the phone app shares the lockfile
      # with the two web apps, which is what keeps Angular one version here.
      - run: npm ci
      - run: npm run build --workspace mobile
      - run: npm test --workspace mobile -- --watch=false
      # The web build is what Capacitor copies into the native shells, so a
      # copy that fails is a release that would ship the previous build.
      # Android only here: the iOS copy wants CocoaPods and a Mac.
      - run: npx cap copy android
        working-directory: apps/mobile

  # The four production images, built the way a release builds them, and the
  # compose file that runs them read the way a deploy reads it. Nothing is
  # pushed and nothing is kept: this finds a Dockerfile that has stopped
  # building on the day it stops, not on the night of a release.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every variable compose.prod.yml refuses to start without, given a
      # dummy, with the example standing in for .env.production so a line in
      # it that compose cannot read fails here as well. Nothing in either file
      # is a secret, and nothing here needs one. Then the one-box override
      # (compose.contabo.yml) on top of it, the import's profile included,
      # with dummies for the database and Redis passwords it will not start
      # without.
      - name: compose.prod.yml
        run: |
          cp .env.production.example .env.production
          printf '%s\n' TAG=ci TRUSTED_PROXIES=10.0.0.1 SITE_HOSTS=example.test \
            API_BASE_URL=https://api.example.test CONSOLE_URL=https://console.example.test \
            PUBLIC_URL=https://example.test DB_USERNAME=ci DB_PASSWORD=ci REDIS_PASSWORD=ci \
            > "$RUNNER_TEMP/ci.env"
          docker compose --env-file .env.production --env-file "$RUNNER_TEMP/ci.env" \
            -f ops/docker/compose.prod.yml config --quiet
          docker compose --env-file .env.production --env-file "$RUNNER_TEMP/ci.env" \
            -f ops/docker/compose.prod.yml -f ops/docker/compose.contabo.yml \
            --profile legacy config --quiet
      # Each image's layers are kept in the Actions cache under its own name,
      # so the three a change did not touch come back from the cache rather
      # than being built again.
      - uses: docker/setup-buildx-action@v4
      - name: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/api.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # The same image with the MySQL driver legacy:import needs, which is
      # built only on the day of a cutover — the worst day to find it broken.
      - name: api (legacy import)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/api.Dockerfile
          target: legacy
          push: false
          load: false
          cache-from: |
            type=gha,scope=api
            type=gha,scope=api-legacy
          cache-to: type=gha,scope=api-legacy,mode=max
      - name: api-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/api-web.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api-web
          cache-to: type=gha,scope=api-web,mode=max
      - name: console
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/console.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=console
          cache-to: type=gha,scope=console,mode=max
      - name: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
