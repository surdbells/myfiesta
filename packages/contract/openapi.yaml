openapi: 3.1.0

info:
  title: myFiesta API
  version: 0.1.0
  description: |
    The contract both client languages generate from.

    Flutter cannot consume a TypeScript package, so there is no shared library
    between mobile and web. This file is what stops the Dart and TypeScript
    clients drifting apart — it does the job an Nx workspace would otherwise do,
    and it is why hand-maintained URL strings are gone.

    Two conventions run through everything below.

    **Money is a pair.** An integer amount in minor units and a currency. Never
    a float, never a bare number, never a preformatted string. The platform this
    replaces returned "$1,234.00" from the API and re-parsed it in the client.

    **Errors are RFC 7807 problem documents** with real status codes. The old
    API answered HTTP 200 for everything and buried the outcome in the body,
    which made interceptors and retries impossible.

servers:
  - url: https://api.myfiesta.ca
    description: Production
  - url: http://localhost:8000
    description: Local

tags:
  - name: Discovery
    description: Public. No authentication — browsing and buying need no account.
  - name: Checkout
    description: Guest checkout is the primary path.
  - name: Tickets
    description: Retrieval and transfer, by the holder.
  - name: Door
    description: Check-in. Reachable only by an event-scoped door token.
  - name: Account
    description: |
      Getting an account, proving its address, agreeing to the terms and
      deleting it. Everything signed in here takes any token that speaks for a
      person, attendee or organizer; a door pass is refused.
  - name: Organizer
    description: The console. An organizer token, checked against membership of the organization.

security: []

paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness probe
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/health/ready:
    get:
      operationId: healthReady
      summary: Whether an order can be taken and seen through
      description: |
        For an uptime monitor, never a load balancer: a stopped queue worker is
        a reason to page somebody, not to take the site away from the people
        buying on it. `/api/health` and `/up` only say the process answered.

        Asks each part in turn — the database answers, the cache keeps what it
        is given, both disks take a file, a worker has run a job lately and
        the scheduler has run lately — and answers 503 when any does not.
        What a failing check says is a fixed sentence, never an exception's
        message, a host name or a count: anybody may ask. Never cached.
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Every part answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '429':
          description: Asked more than 30 times in a minute from one address.
        '503':
          description: At least one part did not answer. Which, and a sentence about it, are in `checks`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /api/contact:
    get:
      operationId: getContact
      summary: Who operates the platform, and how to reach them
      description: |
        For the site's contact and legal pages. Set once per deployment, so
        staging never shows production's details. Anything not set is null
        rather than a placeholder, and `complete` is false until a registered
        name, a support inbox and one postal address are all set — the pages
        show a notice while it is. Cached for five minutes.
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: The operator's details, as far as they are set.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Contact' }

  /api/discover:
    get:
      operationId: discover
      summary: Everything the front page needs, in one request
      description: |
        Bounded shelves of events — featured, upcoming, happening today, this
        weekend, almost sold out, sold out and recently past — with the
        categories and cities that have something on, real counts, and the
        service charge in each currency. "Today" and "this weekend" are read in
        each event's own zone. Every card carries its availability. Kept for
        up to a minute; the full list, paged and filtered, is /api/events.
      tags: [Discovery]
      security: []
      parameters:
        - name: city
          in: query
          description: Narrows the event shelves to one city, by name, matched as its slug is ("Montreal" finds "Montréal").
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: The front page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }

  /api/discover/facets:
    get:
      operationId: discoverFacets
      summary: The categories and cities that have something on
      description: For the listing's filters and the search's city picker. Kept for up to a minute.
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: Categories and cities, most events first.
          content:
            application/json:
              schema:
                type: object
                required: [categories, cities]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryPlace' }
                  cities:
                    type: array
                    items: { $ref: '#/components/schemas/CityPlace' }

  /api/discover/categories/{slug}:
    get:
      operationId: discoverCategory
      summary: One category's own page
      description: |
        A category on the fixed list, or one events are still filed under,
        found by the slug /api/discover and the facets send. Known with nothing
        on is still 200, with `events` zero; unknown is 404.
      tags: [Discovery]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CategoryPlace' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/discover/cities/{slug}:
    get:
      operationId: discoverCity
      summary: One city's own page
      description: |
        A city with something on, or on in the last 90 days, found by its
        slug. Where two spellings share a slug ("Montréal", "Montreal") the
        one most of its events use is the name. Unknown is 404.
      tags: [Discovery]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The city.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CityPlace' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events:
    get:
      operationId: listEvents
      summary: Browse published events
      tags: [Discovery]
      security: []
      parameters:
        - name: q
          in: query
          description: Full-text search. Backed by Postgres, not a separate search service.
          schema: { type: string }
        - name: city
          in: query
          description: By name, matched as its slug is, so every spelling of one city is found ("Montreal" finds "Montréal").
          schema: { type: string }
        - name: category
          in: query
          description: By name, exactly as /api/event-categories lists it.
          schema: { type: string }
        - name: when
          in: query
          description: |
            A window, in each event's own zone. `today` is still on and
            started today or earlier; `weekend` is Friday to Sunday, the one
            underway or the next; `month` is the calendar month; `past` has
            ended and defaults to the most recent first. Without one, what
            has not started yet.
          schema: { type: string, enum: [upcoming, today, weekend, month, past] }
        - name: date_from
          in: query
          description: A calendar day, compared with each event's own date. Inclusive.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: A calendar day, compared with each event's own date. Inclusive.
          schema: { type: string, format: date }
        - name: availability
          in: query
          description: |
            Comma-separated states from Availability; `on_sale` means every
            state but sold out and closed. Decided in the query, so pages stay
            full.
          schema: { type: string, example: 'almost_sold_out,sold_out' }
        - name: free
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [soonest, newest, recent, relevance] }
        - name: country
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: starts_after
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page.
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of published events.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
                  meta: { $ref: '#/components/schemas/CursorMeta' }

  /api/events/{slug}:
    get:
      operationId: getEvent
      summary: An event by its slug
      description: |
        Slugs are routed at the root on the public site and are the shareable
        link. Values from the previous platform are imported verbatim, because
        those URLs are in shared messages, bios, and printed QR codes.
      tags: [Discovery]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: ref
          in: query
          description: |
            Promoter attribution, captured on landing and carried to the order.
            Always optional; a bare link works.
          schema: { type: string }
      responses:
        '200':
          description: The event, with its ticket types.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events/{slug}/calendar.ics:
    get:
      operationId: getEventCalendar
      summary: The event as an iCalendar file
      description: |
        Published and cancelled ticketed events. Times are UTC; a cancelled
        event carries STATUS:CANCELLED so a re-download updates the entry.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One VEVENT.
          content:
            text/calendar:
              schema: { type: string }
        '404': { description: 'No such public event.' }

  /api/events/{slug}/quote:
    post:
      operationId: quoteOrder
      summary: Price a basket
      description: |
        The client sends quantities. It never sends prices — those are read from
        the database by ticket type id. This is the rule that closes the defect
        which let buyers of the previous platform choose what to pay.

        Returns the full breakdown so the buyer sees discount and tax before
        committing, in the fixed order: discount applies to the subtotal, tax
        calculates on the discounted amount, commission takes the net.
      tags: [Checkout]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: A priced quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Not enough stock remains, or the code is exhausted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/events/{slug}/access:
    post:
      operationId: unlockTickets
      summary: Show the ticket types a presale code opens on this event
      description: Throttled to ten attempts a minute, since an answer confirms a code exists.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The code and the tiers it opens that can still be bought.
          content:
            application/json:
              schema:
                type: object
                required: [code, ticket_types]
                properties:
                  code: { type: string }
                  ticket_types: { type: array, items: { type: object } }
        '422': { description: 'Not a valid presale code for this event, or nothing left to open.' }
        '429': { description: 'Too many attempts.' }

  /api/events/{slug}/orders:
    post:
      operationId: createOrder
      summary: Place an order and begin payment
      description: |
        Holds stock in a transaction, then creates a payment session on the rail
        the event currency routes to — NGN to Paystack, everything else to
        Stripe.

        A zero-total order has no gateway at all. Full-value codes, comps,
        RSVPs, and free events go straight to fulfilment, and `payment` is null
        in the response.

        Fulfilment is driven by the signed webhook, never by the client
        returning. Closing the browser after paying still issues the tickets.
      tags: [Checkout]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: Replaying the same key returns the original order.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderCreated' }
        '409':
          description: Stock ran out while the order was being placed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          description: |
            The payment page could not be opened. Nothing was charged, and the
            order keeps its hold; send its reference back as `retry_of` with
            the next attempt, which takes that hold over.
          content:
            application/json:
              schema:
                type: object
                required: [message, reference]
                properties:
                  message: { type: string }
                  reference: { type: string }

  /api/orders/{reference}:
    get:
      operationId: getOrder
      summary: An order by its reference
      description: |
        Readable by the buyer while signed in, or through a signed link sent to
        the address that placed it. Guest checkout means many buyers never
        register, but an address alone is not proof — asserting one is the flaw
        in the scheme this replaces.
      tags: [Checkout]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tickets/{token}:
    get:
      operationId: getTicketsByToken
      summary: A buyer's tickets, with the QR a door reads
      description: |
        Reached from the link in a confirmation email. Unauthenticated by
        necessity: guest checkout is the primary path, so most people holding a
        ticket have no account, and the random per-order token in the path is
        the whole credential.

        It does not expire. The previous platform's ticket links went stale
        before some of its events had happened, and a ticket you cannot open on
        the night is not a ticket.

        Refunded tickets are omitted rather than shown as void — a QR that will
        be turned away is worse than no QR, because its holder finds out at the
        front of the queue.

        The same path opens a ticket somebody was sent, by the token in the
        email that came with it (`sent` is true): that ticket and nothing
        else of the order's — no receipt, no add-ons, no buyer's name, no
        reference. That link closes when the ticket is sent on again, or
        leaves the address it was sent to.
      tags: [Tickets]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order and its live tickets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketAccess' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tickets/{token}/calendar.ics:
    get:
      operationId: getTicketsCalendar
      summary: The night as an iCalendar file, from the ticket page
      description: |
        The same file as /api/events/{slug}/calendar.ics, fetched on the
        ticket link's own credential so that adding the night to a calendar is
        kept in the order's ticket history, as dispute evidence. The ticket
        page's `event.calendar.ics_url` points here. Not cached by anybody but
        the browser that asked.
      tags: [Tickets]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: One VEVENT.
          content:
            text/calendar:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/me/tickets:
    get:
      operationId: listMyTickets
      summary: Tickets held by the signed-in account
      tags: [Tickets]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: Tickets belonging to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/saved:
    get:
      operationId: listSavedEvents
      summary: Nights the signed-in account saved
      description: |
        Soonest first, with what has already happened left out: saving is for
        later, and once later has happened a past night belongs on the tickets
        screen instead.
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: Saved events, soonest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/{slug}/save:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: saveEvent
      summary: Keep a night for later
      description: |
        Saving twice is saving once — a phone on a bad signal sends the same
        tap twice, and the second is not an error anybody should have to read.
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unsaveEvent
      summary: Take a night off the list
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: No longer saved.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizers/{slug}:
    get:
      operationId: getOrganizer
      summary: An organizer page — who they are, what is on, what has been
      description: |
        Public and shareable — the link a promoter puts in a bio, and where
        following an organizer leads.

        A slug with no published ticketed event answers 404, whether the
        account exists or not: registering is not publishing, and a page for
        every account that ever signed up would confirm which names are taken.
      tags: [Discovery]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The organizer, with their nights.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrganizerPage' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/me/following:
    get:
      operationId: listFollowedOrganizers
      summary: Organizers the signed-in account follows
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: Organizers followed, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizerBrand' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/organizers/{slug}/follow:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: followOrganizer
      summary: Hear about an organizer's next night
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: Following.
          content:
            application/json:
              schema:
                type: object
                required: [following]
                properties:
                  following: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unfollowOrganizer
      summary: Stop hearing from an organizer
      tags: [Discovery]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: No longer following.
          content:
            application/json:
              schema:
                type: object
                required: [following]
                properties:
                  following: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tickets/{id}/transfer:
    post:
      operationId: transferTicket
      summary: Hand a ticket to someone else
      description: |
        Authenticated, and only by the holder. The endpoint this replaces took a
        ticket id and an email from anyone at all, with ids being sequential
        integers.

        The same handover as the ticket link's (transferTicketFromLink): the
        ticket gets a new code, so the one on this phone stops opening the
        door; the new holder is emailed it with a link of their own. Refused
        for a ticket somebody has come in on (a table with any of its people
        inside included), one given back for resale, one at the address
        already holding it, and once the event has started. The answer says
        what was done and carries no ticket: the ticket as it now is holds
        the new holder's code.
      tags: [Tickets]
      security:
        - bearerAuth: [attendee]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTransferRequest' }
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The ticket cannot be sent on, with the reason to show its holder; or the name or address is missing.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  /api/events/{event}/scan:
    post:
      operationId: scanTicket
      summary: Check a ticket in
      description: |
        Requires a `door:{event_id}` token, which grants this and nothing else.
        A door token is refused by every other endpoint even when the user
        behind it holds a wider role — otherwise lending a phone to staff for
        one night lends out the whole account.

        Every attempt is recorded, including refusals. Check-in is decided and
        written in one transaction, so two scanners cannot both be told the same
        ticket is valid. A `choose_party` answer is a question rather than an
        attempt, and is not recorded: the scan that answers it is.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The value read from the QR.
                party:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: |
                    How many of the ticket's party go in now. Absent admits the
                    one place left; with more than one left it admits nobody and
                    the result is `choose_party`, for the door to ask how many
                    are here and scan again with the number.
                client_id:
                  type: string
                  format: uuid
                  description: |
                    The scan's own id, minted on the device. A request that
                    times out after the server admitted the guest is retried
                    through the sync endpoint with the same id, and is
                    recognised as the same scan rather than refused as a
                    second person on the ticket. The scan answering
                    `choose_party` is sent under the id of the scan that
                    asked, for the same reason.
      responses:
        '200':
          description: A decision. Refusals are 200 with a result, not errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/events/{event}/door-list:
    get:
      operationId: doorList
      summary: The event's tickets, for checking in with no signal
      description: |
        Downloaded while the door has a connection, so it can keep deciding
        when it loses one. Carries a PBKDF2-SHA256 hash of each code, never
        the code: enough for a device to recognise a code it is shown, never
        enough to produce one. A device hashes a scanned code (trimmed,
        upper-cased) with `salt` and `iterations` and looks the result up.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [event_id, salt, iterations, generated_at, tickets]
                properties:
                  event_id: { type: string, format: uuid }
                  salt: { type: string }
                  iterations: { type: integer }
                  generated_at: { type: string, format: date-time }
                  tickets:
                    type: array
                    items:
                      type: object
                      required: [hash, status, admits, admitted_count]
                      properties:
                        hash: { type: string }
                        status: { type: string, enum: [valid, checked_in, transferred, refunded, void] }
                        admits: { type: integer }
                        admitted_count: { type: integer }
                        holder_name: { type: [string, 'null'] }
                        type: { type: [string, 'null'] }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/events/{event}/scans/sync:
    post:
      operationId: syncOfflineScans
      summary: Send scans made with no signal
      description: |
        Records what the door already did offline; it does not re-decide
        admission. A scan the door accepted counts people in, as far as the
        ticket allows. A scan the door refused admits nobody, even if the
        ticket was valid. Where the two disagree the scan carries a
        `conflict`. Idempotent on `client_id`: a batch whose response was lost
        can be sent again. A batch that fails validation is refused whole.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [client_id, code, offline_result, scanned_at]
                    properties:
                      client_id: { type: string, format: uuid }
                      code: { type: string }
                      party: { type: [integer, 'null'], minimum: 1, maximum: 50 }
                      offline_result: { type: string, enum: [accepted, duplicate, not_found, void, over_capacity] }
                      scanned_at:
                        type: string
                        format: date-time
                        description: When it happened on the device. Ignored if more than five minutes ahead or three days behind.
      responses:
        '200':
          description: Each scan's recorded result, and the disagreements separately.
          content:
            application/json:
              schema:
                type: object
                required: [data, conflicts]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScanResult' }
                  conflicts:
                    type: array
                    description: The subset where the offline door and the server disagreed.
                    items: { $ref: '#/components/schemas/ScanResult' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/events/{event}/sellable:
    get:
      operationId: doorSellable
      summary: What the door may sell, and what is left of it
      description: |
        The same tiers a buyer sees, with what is genuinely left on each —
        somebody selling the last four tickets needs the number to be true at
        the moment they say it out loud.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - { name: event, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: What is on sale at this door.
          content:
            application/json:
              schema:
                type: object
                required: [currency, methods, ticket_types]
                properties:
                  currency: { type: string }
                  methods:
                    type: array
                    items: { type: string, enum: [cash, card, transfer] }
                  ticket_types:
                    type: array
                    items:
                      type: object
                      required: [id, name, price]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        price: { $ref: '#/components/schemas/Money' }
                        admits: { type: integer }
                        remaining: { type: [integer, 'null'] }
                        sold_out: { type: boolean }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/events/{event}/door-sales:
    post:
      operationId: sellAtTheDoor
      summary: Sell to somebody standing in front of you
      description: |
        A walk-up, paid for on the spot. An ordinary order in every respect
        that matters — it takes the same stock, mints the same tickets and
        cannot oversell against an online buyer reaching the last ticket at
        the same moment.

        What it carries that an online order does not: how it was paid, and
        who took it. The money never reaches the platform, so nothing is
        charged on it and the ledger takes it back out of what is owed.

        Neither a name nor an address is required. The person paying cash is
        not going to spell one out, and their ticket is scanned by the phone
        that just sold it — the codes come back in the response for exactly
        that reason. Give an address and the ticket is emailed as usual.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - { name: event, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, method]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [ticket_type_id, quantity]
                    properties:
                      ticket_type_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                method: { type: string, enum: [cash, card, transfer] }
                name: { type: [string, 'null'] }
                email: { type: [string, 'null'], format: email }
      responses:
        '201':
          description: Sold, and paid.
          content:
            application/json:
              schema:
                type: object
                required: [reference, total, method, tickets]
                properties:
                  reference: { type: string }
                  total: { $ref: '#/components/schemas/Money' }
                  method: { type: string }
                  emailed:
                    type: boolean
                    description: Whether an address was given and the ticket sent to it.
                  tickets:
                    type: array
                    items:
                      type: object
                      required: [id, code]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        type: { type: [string, 'null'] }
                        admits: { type: integer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Sold out, or a method nobody pays with.

  /api/events/{event}/takings:
    get:
      operationId: doorTakings
      summary: The till, for whoever is counting it
      description: |
        Per method, because that is what is being counted — a tin of cash, a
        terminal's own total, a bank app's list of transfers — and each has to
        agree with its own thing. Per till after that: a night with two doors
        has two tins, and a manager reconciles them one at a time.
      tags: [Door]
      security:
        - bearerAuth: [door]
      parameters:
        - { name: event, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: What was taken at the door.
          content:
            application/json:
              schema:
                type: object
                required: [currency, tickets, total, by_method, by_till]
                properties:
                  currency: { type: string }
                  tickets: { type: integer }
                  total: { $ref: '#/components/schemas/Money' }
                  by_method:
                    type: array
                    items:
                      type: object
                      required: [method, orders, total]
                      properties:
                        method: { type: string }
                        orders: { type: integer }
                        total: { $ref: '#/components/schemas/Money' }
                  by_till:
                    type: array
                    items:
                      type: object
                      required: [label, orders, total]
                      properties:
                        label: { type: string }
                        orders: { type: integer }
                        total: { $ref: '#/components/schemas/Money' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/door-passes/{secret}:
    get:
      operationId: previewDoorPass
      summary: What a door link opens, before opening it
      description: |
        No token. Opening is a separate call so that a chat app fetching the
        link for a preview cannot use up its one claim.
      security: []
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The pass and its event.
          content:
            application/json:
              schema:
                type: object
                required: [label, state, expires_at, event]
                properties:
                  label: { type: string }
                  state: { type: string, enum: [waiting, active, expired, revoked, ended] }
                  expires_at: { type: string, format: date-time }
                  event: { type: object }
        '404': { description: 'Not a door link.' }

  /api/door-passes/{secret}/claim:
    post:
      operationId: claimDoorPass
      summary: Open a door link on this device
      description: |
        Works once. Returns a token whose only ability is `door:{event_id}`,
        expiring with the pass; use it for the scan, door-list and sync
        endpoints of that event. Every other endpoint refuses it. Signing out
        with it deletes it.
      security: []
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The door token and the event it opens.
          content:
            application/json:
              schema:
                type: object
                required: [token, label, expires_at, event]
                properties:
                  token: { type: string }
                  label: { type: string }
                  expires_at: { type: string, format: date-time }
                  event: { type: object }
        '404': { description: 'Not a door link.' }
        '410': { description: 'Already opened on another device, taken back, or expired.' }
        '429': { description: 'Too many attempts.' }

  /api/auth/register:
    post:
      operationId: signUp
      summary: Ask for an account
      description: |
        From the console or the phone. The answer is the same for every
        address — 202, check your email — because a session for a new address
        and none for a known one would tell anybody watching which addresses
        are taken. The emailed link makes the account.

        The one exception is joining by invitation: that link was sent to the
        address and opened from it, so the account is made there and then and
        answered 201 with a session, in the same shape signing in gives.

        `accept_terms` is refused with a 422 when it is not true, for every
        address alike and before anything is looked up.
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Joined by invitation, and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '202':
          description: Every other sign-up, known address or not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignUpPending' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many sign-ups from this network address in the last hour. Said against `email`, like a validation error.

  /api/auth/email/verification:
    post:
      operationId: sendEmailVerification
      summary: Send a fresh link to prove the account's address
      description: |
        Only ever to the address the signed-in account already has, so saying
        where it went tells nobody anything. Until the address is proved,
        putting an event on sale, asking to be paid and changing where payouts
        go are refused with a 403 whose code is `email_unverified`.

        The link opens `/verify-email/{user}/{hash}`, a page on this host.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      responses:
        '200':
          description: The address is already proved. Nothing was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationAnswer' }
        '202':
          description: A link is on its way.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationAnswer' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: A link went a moment ago. The message says when to ask again.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  verified: { type: boolean, const: false }

  /verify-email/{user}/{hash}:
    parameters:
      - name: user
        in: path
        required: true
        description: The account's id.
        schema: { type: string, format: uuid }
      - name: hash
        in: path
        required: true
        description: Ties the link to the address it was sent to. A link to an address the account has since moved from is dead.
        schema: { type: string }
      - name: expires
        in: query
        required: true
        schema: { type: integer }
      - name: signature
        in: query
        required: true
        schema: { type: string }
    get:
      operationId: showEmailVerificationPage
      summary: The page the emailed link opens
      description: |
        A page, not an API: plain HTML on this host, because it is usually
        opened in a mail client's own browser with nobody signed in. Listed so
        the link an email carries is part of the contract; no client calls it.

        Only shows what will happen, because mail scanners follow links.
      tags: [Account]
      security: []
      responses:
        '200':
          description: Asks for the account's password, or says the address is already proved.
          content:
            text/html:
              schema: { type: string }
        '410':
          description: The link has expired, was tampered with, or is for an address the account no longer has.
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: confirmEmailVerificationPage
      summary: Prove the address, with the account's password
      description: |
        The form on the page above, posted back to the same signed address.
        The password is asked for because an account can have been made with
        somebody else's address, and that inbox's owner clicking a button must
        not be what lets it publish events or point payouts somewhere.
        Five wrong passwords in an hour and it stops listening.
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: The address is proved.
          content:
            text/html:
              schema: { type: string }
        '410':
          description: The link has expired, was tampered with, or is for an address the account no longer has.
          content:
            text/html:
              schema: { type: string }
        '422':
          description: Not the account's password. The page asks again.
          content:
            text/html:
              schema: { type: string }
        '429':
          description: Too many wrong passwords. Try again in an hour.
          content:
            text/html:
              schema: { type: string }

  /api/auth/terms:
    get:
      operationId: getTermsStanding
      summary: Whether the signed-in account agreed to the terms in force now
      description: |
        The terms, the privacy policy and the refund policy, as one version.
        Signing up and checking out ask; this is for the accounts that never
        were — made before sign-up asked, or brought over from the previous
        platform — and for new words. Refused to a staff session and to a door
        pass: neither is anybody agreeing for themselves.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      responses:
        '200':
          description: Where the account stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsStanding' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: acceptTerms
      summary: Agree to the terms in force now
      description: |
        The box, ticked. Agreeing again to words already agreed to changes
        nothing: the moment kept is when this account first agreed to them.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept_terms]
              properties:
                accept_terms:
                  type: boolean
                  const: true
                  description: Refused with a 422 when it is not true.
      responses:
        '200':
          description: Where the account stands now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsStanding' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/auth/erasure:
    get:
      operationId: previewAccountErasure
      summary: What deleting the signed-in account would do
      description: |
        Shown beside the button, before anybody types a password: the
        organizations the person would leave, and any they are the only owner
        of, which stop it. The same erasure as the privacy page's form.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      responses:
        '200':
          description: What would happen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountErasurePreview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: eraseAccount
      summary: Delete the signed-in account
      description: |
        Deleting an account from inside the app that made it, which the App
        Store requires. The password is asked for, as it is before the address
        can be moved: a phone left unlocked is signed in, and must not be
        enough to erase the person it belongs to. Five tries an hour, right or
        wrong.

        A proved address is deleted there and then, and every device is
        signed out, this one included. Any other is sent the privacy page's
        link first, and nothing changes until it is opened. Orders and the
        ledger are kept for the years the preview says, with nobody's name on
        them.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
      responses:
        '200':
          description: Deleted, and signed out everywhere.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountErasureResult' }
        '202':
          description: A link went to the address. Nothing changes until it is opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountErasureResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Refused, and nothing changed — the only owner of an organization, or somebody with myFiesta staff access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountErasureResult' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many tries at the password in the last hour. Said against `current_password`, like a validation error.

  /api/organizer/saved-views:
    get:
      operationId: listSavedViews
      summary: The views this person keeps of one list
      description: |
        A view is a list's filters, sort and columns kept under a name — by one
        person, for one organization. Applying one asks the list's own
        endpoint, so a view never shows anybody more than the list would.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
        - name: list
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SavedViewList' }
      responses:
        '200':
          description: Their views of that list, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SavedView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: saveView
      summary: Keep a view, or replace the one with the same name
      description: |
        The state is flat data: up to 40 keys (lowercase, digits and
        underscores), each a string of up to 200 characters, a number, a
        boolean, null, or a list of up to 50 of those; 4 KB in all. At most 30
        views per list. Saving a name that exists replaces that view (200).
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list, name, state]
              properties:
                list: { $ref: '#/components/schemas/SavedViewList' }
                name: { type: string, maxLength: 60 }
                state: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The view of that name, replaced.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SavedView' }
        '201':
          description: A new view, kept.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SavedView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/saved-views/{view}:
    delete:
      operationId: deleteSavedView
      summary: Stop keeping a view
      description: Somebody else's view, or another organization's, is not found.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
        - name: view
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizer/standing:
    get:
      operationId: getOrganizationStanding
      summary: Whether the platform is selling for this organization
      description: |
        For the console's suspension banner. Asked on its own rather than read
        from the sign-in, because a suspension lands while people are signed
        in. Any member may ask. The reason is only there when myFiesta chose to
        share it.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Where the organization stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationStanding' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/events/{event}/submit:
    post:
      operationId: submitEventForReview
      summary: Send a draft to myFiesta to be looked at before it goes on sale
      description: |
        Nothing goes on sale without an approval. This sends the event to the
        review queue, where it waits in `in_review` and cannot be changed:
        every write that would change what a buyer sees or pays for it answers
        423 until it is decided or taken back. The people at the organization
        who can publish are emailed that it arrived, and the staff who review
        it that it is waiting.

        Where an approval still stands for the event as it is — it was on
        sale, was taken off, and nothing a buyer sees has changed since it was
        approved; or it is the next date of an approved series and the same
        night apart from its dates — it goes straight on sale instead, and
        `outcome` says `published`. Only its dates are checked then, since the
        listing is what was approved. Neither applies once staff have sent the
        event back: after a rejection only another approval puts it on sale.

        Needs what publishing needed: permission to publish, a proved address,
        and an event that is ready. Every reason it is not comes back at once
        in `reasons`. Refused while the organization is suspended.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent for review, back on sale, or already one of those.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not allowed to publish, an unproved address (`code` email_unverified), or the organization is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewRefusal' }
        '422':
          description: Not ready, cancelled, or taken off sale by myFiesta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewRefusal' }

  /api/organizer/events/{event}/withdraw:
    post:
      operationId: withdrawEventFromReview
      summary: Take an event back from review, to change something
      description: |
        Back to a draft, which can be changed and sent again. The people at
        the organization who can publish are emailed to confirm. Pressing it
        again changes nothing.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A draft again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Not waiting for review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewRefusal' }

  /api/organizer/events/{event}/publish:
    post:
      operationId: setEventOnSale
      summary: Send for review, or take off sale
      description: |
        Kept for clients that already call it. `published` is the same as
        submitting for review; `draft` takes an event off sale, or takes it
        back from review while it waits. Taking an event off sale never waits
        for a proved address.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published] }
      responses:
        '200':
          description: What happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Not ready, cancelled, or taken off sale by myFiesta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReviewRefusal' }

  /api/organizer/payouts:
    get:
      operationId: getPayoutStatement
      summary: What the organization is owed, what was sent, and anything owed back
      description: |
        The statement, in the organization's main currency. Settlements are
        read-only: paying out is done by myFiesta staff against a real bank.

        When staff pay a payout request for more than is owed, the difference
        is an advance and the balance goes below zero by exactly that much.
        `overdraft` then says how much was advanced and when, what sales have
        paid back since, what was repaid by transfer, and what is outstanding,
        with a sentence for all of it. The same block describes a balance that
        refunds took below zero after a payout, with `advanced` null. The next
        sales pay it back; nothing more can be asked for until the balance is
        above zero.

        Needs the money permission (owners, managers and finance).
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutStatement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/payouts/requests:
    post:
      operationId: requestPayout
      summary: Ask to be paid what is owed
      description: |
        Up to the balance, to the payout details on file, one waiting request
        per currency. Refused with a sentence while the balance is not above
        zero — below zero it says what is owed back and what pays it back.
        Owners and finance only; an address that is not yet proved is refused
        with `email_unverified`.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units, in the statement's currency.
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Asked. Nothing moves until staff pay it.
          content:
            application/json:
              schema:
                type: object
                required: [data, message]
                properties:
                  data: { $ref: '#/components/schemas/PayoutRequestRow' }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Refused, with the reason in `message`.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  # Each feature added since writes its paths under its own anchor, so two
  # features never edit the same lines of this file.
  # --- track: pay ---
  /api/organizer/events/{event}/pay-later:
    get:
      operationId: getEventPayLater
      summary: Whether buyers can pay for a night later, and what it costs the organizer
      description: |
        The organizer's opt-in to Klarna and Affirm on Stripe's payment page,
        with what each lender charges beside a card's fee, so the console can
        name the difference before the organizer turns it on. Offered to a
        buyer only while myFiesta has it switched on (`available`), for nights
        priced in Canadian dollars, and from `max_days_before_event` days
        before the night (`offered_now`).
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The opt-in as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayLaterSetting' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setEventPayLater
      summary: Let buyers pay for a night later, or stop
      description: |
        The organizer pays what the lender charges over a card's fee on every
        order paid this way, taken off their balance as an adjustment once
        Stripe has said what it charged. Needs the permission to edit the
        event. Turning it on is refused when myFiesta has paying later
        switched off or the night is not in Canadian dollars; turning it off
        is always taken.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The opt-in as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayLaterSetting' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  # --- track: transfer ---
  /api/tickets/{token}/transfer/{ticket}:
    post:
      operationId: transferTicketFromLink
      summary: Send a ticket to someone else, from a ticket link
      description: |
        "Send to someone" on the tickets page, on the same credential as the
        tickets themselves: an order's link, where the ticket must be on the
        order and still the buyer's, or the link a ticket was sent with,
        which names that ticket. A wrong token, a closed one and a ticket
        that is not the link's all answer 404, so none can be told apart.

        Through the same handover as the phone (transferTicket): a new code,
        the old one refused at the door; an email to the new holder with the
        ticket and a link that opens it and nothing else of the order; the
        link the last holder was sent stops opening it. Refused for a ticket
        somebody has come in on, one given back for resale, one at the
        address already holding it, and once the event has started.
      tags: [Tickets]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: ticket
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTransferRequest' }
      responses:
        '200':
          description: Sent. The page as it now is, without the ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTransferAnswer' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The ticket cannot be sent on, with the reason to show; or the name or address is missing.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  # --- track: profile ---
  /api/auth/me:
    get:
      operationId: me
      summary: The signed-in account
      description: |
        Who is signed in, and the organizations they belong to with what they
        may do in each, as the server resolves it. The phone asks again when it
        opens, so a photo or a time zone changed on another device turns up.
        A door pass is refused: Sanctum sees it as the account that issued it.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/avatar:
    post:
      operationId: uploadAvatar
      summary: Put a photo on the signed-in account
      description: |
        A JPEG, PNG or WebP up to 12 MB. The bytes are read for what they are,
        cropped to 256 pixels square and re-encoded as JPEG, which drops where
        the photo was taken. It replaces the photo the account had, and the
        old file is deleted. Seen only by the person it belongs to.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Kept. The address is new for every photo, so no cache shows the old one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPhoto' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429': { description: 'Too many uploads. Twenty a minute.' }
    delete:
      operationId: removeAvatar
      summary: Take the photo off the signed-in account
      description: The file is deleted, and initials take its place.
      tags: [Account]
      security:
        - bearerAuth: [attendee]
        - bearerAuth: [organizer]
      responses:
        '200':
          description: Gone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPhoto' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- track: public ---
  /api/organizers/{slug}/events:
    get:
      operationId: listOrganizerEvents
      summary: An organizer's nights, twelve at a time
      description: |
        What "Show more past events" asks for. With `when=past`, page 1 is the
        same twelve the organizer page carries in `past`, and page 2 on are
        the older ones, newest first. With `when=upcoming`, the nights still
        to come, soonest first, twelve at a time (the organizer page carries
        all of those in `upcoming`, unpaged). Nights on the same evening keep
        their order, so no page repeats or skips one. Only the nights a
        stranger may see: an invitation event is never listed.

        A slug with no published ticketed event answers 404, as the page does.
      tags: [Discovery]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: when
          in: query
          required: true
          schema: { type: string, enum: [past, upcoming] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        '200':
          description: One page of their nights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizerEvents' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Asked more than 60 times in a minute from one address.

  /api/help/videos:
    get:
      operationId: listHelpVideos
      summary: The how-to videos on help/videos
      description: |
        Published videos only, in the order staff set. Each is named by its
        YouTube id alone; the page builds the thumbnail and the player's
        address itself, the player on youtube-nocookie.com and only once a
        reader presses play. An empty list when there are none. Cached for
        five minutes.
      tags: [Discovery]
      security: []
      responses:
        '200':
          description: The videos, buyers' and organizers' together.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HelpVideo' }
        '429':
          description: Asked more than 60 times in a minute from one address.

  # --- track: sched ---
  /api/organizer/events/{event}/series:
    patch:
      operationId: updateSeries
      summary: Change how a repeating night ends, and whether its dates go on sale by themselves
      description: |
        Only what is sent changes. `count` or `until` moves the end either
        way: dates still to come past a new, earlier end that nobody holds a
        ticket for (valid, used or listed for resale) are removed, the rest
        are kept, and dates newly inside a longer run are made at once.
        `frequency` can only be sent as it already is; a different one is
        refused with "Stop this series and start a new one."

        `auto_publish` and `on_sale_days_before` need the permission to put
        events on sale and a confirmed email address. Each date then goes on
        sale by itself `on_sale_days_before` days before its night (as soon
        as it is made when null), sent by events:go-live as the member who
        turned it on, asked again at that time: straight on sale as the
        approved night on a new date, through review otherwise. The days are
        counted on the venue's calendar. Only draft dates never on sale and
        not sent back by staff are given a time. Turned off, the times the
        series gave its draft dates are taken back.

        A staff session acting as the organization is refused (403) a change
        to the end, turning `auto_publish` on and `on_sale_days_before`;
        turning `auto_publish` off stays open.

        The time a single night goes on sale is `publish_at` on
        PATCH /api/organizer/events/{event}.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          description: Any date of the series.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frequency:
                  type: string
                  enum: [weekly, fortnightly, monthly]
                  description: Accepted only as it already is.
                count:
                  type: [integer, 'null']
                  minimum: 2
                  maximum: 104
                  description: Every date in all, the first included. Not with `until`.
                until:
                  type: [string, 'null']
                  format: date
                  description: The last day, in the venue's zone; that day's night is kept.
                auto_publish: { type: boolean }
                on_sale_days_before:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 365
      responses:
        '200':
          description: The series as it now stands, and what changing it did.
          content:
            application/json:
              schema:
                type: object
                required: [series, removed, kept, created, message]
                properties:
                  series: { $ref: '#/components/schemas/OrganizerSeries' }
                  removed: { type: integer, description: 'Dates past the new end that nobody had bought into, now gone.' }
                  kept: { type: integer, description: 'Dates past the new end kept because somebody holds a ticket for them.' }
                  created: { type: integer, description: 'Dates newly inside a longer run, made now.' }
                  message: { type: string, description: 'What changed, written for the organizer.' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: The night is waiting for review, and cannot change until it is decided.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  code: { type: string }

  # --- track: clone ---
  /api/organizer/events/{event}/duplicate:
    post:
      operationId: duplicateEvent
      summary: Copy an event into a new draft, with changes
      description: |
        The copy is always a draft, so it goes through review. It carries the
        details, tiers and prices, price ladders, extras, questions, reminder
        times and the poster; never sales, codes or the gallery. Everything in
        the body is optional: what is not given is copied as it is. A tier not
        listed comes across unchanged; on a listed tier, a field not given is
        left as it is, and a quantity of null is unlimited. Sales windows move
        with the start. Refused (422) for an event myFiesta has taken off sale.
        Needs permission to create events in the event's organization.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyAdjustments' }
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCopy' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/templates:
    get:
      operationId: listEventTemplates
      summary: The organization's event templates
      description: |
        Events kept as a starting point, by name. Needs permission to create
        events in the organization.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The templates, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventTemplate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: saveEventTemplate
      summary: Keep an event as a template
      description: |
        The template is the event as it is now, kept apart from it: changing
        the event later does not change the template. The poster is copied
        into files of the template's own. Names are unique in an organization,
        whatever their capitals; at most 50 templates each. Refused (422) for
        an event myFiesta has taken off sale.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_event_id, name]
              properties:
                from_event_id: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '201':
          description: The template, kept.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EventTemplate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/templates/{template}:
    delete:
      operationId: deleteEventTemplate
      summary: Delete a template
      description: |
        The template and its poster's files go. Events made from it keep
        theirs. Another organization's template is not found.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizer/templates/{template}/events:
    post:
      operationId: createEventFromTemplate
      summary: Make a new draft event from a template
      description: |
        A start is required; the rest of the body changes the new event on the
        way, as when copying an event. The new event is a draft that goes
        through review: a template is never approved itself. A venue the
        organization has since removed is left off. Refused (422) while the
        event the template was kept from is taken off sale by myFiesta.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CopyAdjustments'
                - type: object
                  required: [starts_at]
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCopy' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # --- track: share ---
  /api/events/{slug}/share-link:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: getShareLink
      summary: My friend-discount link to a night
      description: |
        For somebody signed in who holds a ticket to the night that will
        still get them in. A buyer is given theirs when they pay; this is for
        anybody else holding one. Asking twice gets the same link.
      tags: [Tickets]
      security:
        - bearerAuth: [attendee]
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ShareLink' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This account holds no live ticket to the night.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The night has no friend discount, or its online sales are over.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  /api/events/{slug}/friend-discount:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: checkFriendDiscount
      summary: Whether a ref is a friend's link that takes money off a night
      description: |
        For the event page to greet somebody who arrived by a friend's link.
        The page is the same for everybody, and a ref's shape alone cannot
        say: a promoter's slug can look like one, and a link stops working
        once its holder no longer has a ticket that gets them in. One 404
        for every kind of no.
      tags: [Discovery]
      security: []
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The discount the link takes off.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ShareOffer' }
        '404':
          description: No such night, no offer, or not a working friend's link to it.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  /api/organizer/events/{event}/share-offer:
    put:
      operationId: setShareOffer
      summary: Start, change or end a night's friend discount
      description: |
        A friend who buys through a buyer's link saves `discount_bps`, and the
        buyer is sent a single-use code worth the same off their next tickets
        from the organizer, for up to `max_rewards` friends. The organizer
        pays for both discounts out of the night's proceeds. Null
        `discount_bps` ends the offer; links and rewards already out keep
        what they were given. Needs the codes permission, and is refused
        while the night waits for review.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discount_bps, max_rewards]
              properties:
                discount_bps:
                  type: [integer, 'null']
                  description: Basis points (1500 is 15%), from 100 to the platform's cap. Null ends the offer.
                max_rewards:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '200':
          description: The offer as it now stands; `discount_bps` is null once it has ended.
          content:
            application/json:
              schema:
                type: object
                required: [share_offer]
                properties:
                  share_offer: { $ref: '#/components/schemas/OrganizerShareOffer' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: The night is waiting for review, and its discounts cannot change until it is decided.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  code: { type: string }

  # --- track: survey ---
  /api/surveys/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The link's whole credential, from the survey email.
        schema: { type: string, maxLength: 64 }
    get:
      operationId: getSurvey
      summary: The survey somebody was emailed after a night
      description: |
        No sign-in: the token is the whole credential, as on a ticket link.
        Answers with the night and the questions it was sent with, and
        whether this link has been answered — never with whose link it is.
        Sixty a minute.
      tags: [Tickets]
      responses:
        '200':
          description: The survey.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSurvey' }
        '404':
          $ref: '#/components/responses/NotFound'
        '429': { description: 'Too many requests.' }
    post:
      operationId: answerSurvey
      summary: Answer the survey, once
      description: |
        Each answer is checked against the questions the night was sent with:
        `nps` takes a whole number from 0 to 10, `rating5` from 1 to 5,
        `single` one of the options, `multi` a list of them, and `text` up to
        2,000 characters. An empty answer to an optional question is no
        answer. One answer per link, never edited. Ten a minute.
      tags: [Tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  description: Keyed by question id.
                  additionalProperties:
                    oneOf:
                      - type: integer
                      - type: string
                      - type: array
                        items: { type: string }
                      - type: 'null'
      responses:
        '201':
          description: Kept.
          content:
            application/json:
              schema:
                type: object
                required: [message, survey]
                properties:
                  message: { type: string }
                  survey: { $ref: '#/components/schemas/PublicSurvey' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This link has already been answered.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429': { description: 'Too many requests.' }

  /api/organizer/surveys:
    get:
      operationId: getSurveyOverview
      summary: Whether surveys go, and how the organization's recent nights answered
      description: |
        For the console's Surveys screen. Needs `messages.send`: a survey is an
        email to the people who came. The recommend score of a night is null
        until five people have answered it.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          description: Which of the member's organizations. Their first when left out.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The organization's switch and its last twenty surveyed nights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyOverview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/surveys/settings:
    put:
      operationId: setSurveysEnabled
      summary: Surveys on or off for every night of the organization
      description: On by default. Off stops every night's survey until it is switched back on.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surveys_enabled]
              properties:
                surveys_enabled: { type: boolean }
      responses:
        '200':
          description: Switched.
          content:
            application/json:
              schema:
                type: object
                required: [surveys_enabled, nights_due_now, message]
                properties:
                  surveys_enabled: { type: boolean }
                  nights_due_now:
                    type: integer
                    description: Finished nights the next hourly run asks about with surveys on.
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/survey-templates:
    get:
      operationId: listSurveyTemplates
      summary: The surveys a night can send
      description: myFiesta's own first, then the organization's, archived ones left out.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The surveys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyTemplateList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSurveyTemplate
      summary: Write a survey of the organization's own
      description: Twelve questions at most. A `single` or `multi` question needs two different options.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      parameters:
        - name: X-Organization
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyTemplateInput' }
      responses:
        '201':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SurveyTemplate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/survey-templates/{template}:
    parameters:
      - name: template
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: X-Organization
        in: header
        required: false
        schema: { type: string, format: uuid }
    put:
      operationId: updateSurveyTemplate
      summary: Change one of the organization's surveys
      description: |
        Nights already sent keep the questions they were sent with; nights
        still to go send these. myFiesta's own and another organization's
        answer 404.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyTemplateInput' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SurveyTemplate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: archiveSurveyTemplate
      summary: Remove one of the organization's surveys
      description: |
        Archived rather than deleted, so a night sent with it can still be
        compared with the next. A night that was going to send it sends
        myFiesta's instead, and the message says how many.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizer/events/{event}/survey:
    parameters:
      - name: event
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEventSurvey
      summary: One night's survey
      description: Whether it goes, which questions, when, and why not when it will not.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      responses:
        '200':
          description: The survey.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSurvey' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateEventSurvey
      summary: Switch one night's survey, choose its questions, or change its delay
      description: |
        Any of the three, each left as it is when left out. `template_id`
        null is myFiesta's own. Refused with 409 once the survey has gone.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                template_id: { type: [string, 'null'], format: uuid }
                send_delay_hours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        '200':
          description: The survey as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSurvey' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/organizer/events/{event}/survey/results:
    parameters:
      - name: event
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEventSurveyResults
      summary: What the people who came said about one night
      description: |
        Counts, scores and what was written, never who said it. Nothing is
        broken down until `minimum` people have answered, and no question
        until that many have answered it.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      responses:
        '200':
          description: The results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyResults' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizer/events/{event}/survey/send:
    parameters:
      - name: event
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendEventSurvey
      summary: Send one night's survey now
      description: |
        Rather than when the hourly run gets to it. Only once the night is
        over, and once: each person is asked one time. The console confirms
        first, because an email cannot be called back.
      tags: [Organizer]
      security:
        - bearerAuth: [organizer]
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [message, invited, survey]
                properties:
                  message: { type: string }
                  invited: { type: integer }
                  survey: { $ref: '#/components/schemas/EventSurvey' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already sent.
        '422':
          description: The night is not over, or the survey is switched off.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }

  # --- track: points ---
  # --- track: pass ---
  # --- track: wait ---
  # --- track: audience ---

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A Sanctum token. Abilities are `attendee`, `organizer`, or
        `door:{event_id}`.

        The mobile app carries all three modes in one binary, so a door-staff
        phone has the organizer interface compiled into it. Hiding it is a
        convenience; the ability check is the boundary.

  responses:
    Unauthorized:
      description: No token, or the token has expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The token is valid but lacks the ability or the ownership.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The request was well-formed but not acceptable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 7807. Carried by every error, with a real status code.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          description: Field-level messages, keyed by input name.
          additionalProperties:
            type: array
            items: { type: string }

    Money:
      type: object
      description: |
        An integer amount in minor units, with its currency. 1250 CAD is
        $12.50; 250000 NGN is 2,500.00 naira.

        Amounts in different currencies are never summed. An organization
        running events in Toronto and Lagos has two balances, not one.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. Cents, kobo.
        currency:
          type: string
          description: >
            Constrained to what the platform actually takes. An open string
            generates a client able to represent prices no gateway can charge.
          enum: [CAD, NGN]

    CursorMeta:
      type: object
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    EventSummary:
      type: object
      # No id. The slug is the public identifier — it is what a shareable link
      # carries and what the site routes on. Exposing the UUID as well would
      # give clients two ways to name the same event and no reason to prefer
      # either.
      required: [slug, title, starts_at, timezone, city, country]
      properties:
        slug: { type: string }
        title: { type: string }
        poster_url: { type: [string, 'null'], format: uri }
        starts_at: { type: string, format: date-time }
        timezone:
          type: string
          description: |
            IANA, per event. The previous system hardcoded one zone for
            everything, which was already wrong for a Toronto business and is
            unworkable once Lagos events exist.
        city: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        from_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        ends_at:
          type: [string, 'null']
          format: date-time
          description: When the night ends, if the organizer said. Lets a card tell a night that is over from one to come.
        is_sold_out:
          type: boolean
          description: Every ticket a stranger can see has gone. A night whose sales closed with places left is not sold out; its availability says closed.
        availability: { $ref: '#/components/schemas/Availability' }
        waitlist:
          type: boolean
          description: Sold out and not started yet, so the waitlist takes names.
        category: { type: [string, 'null'] }
        organizer: { $ref: '#/components/schemas/OrganizerRef' }

    Availability:
      type: object
      description: |
        How much is left, as a buyer is told it. Counted the way checkout
        counts: tickets that still admit somebody plus holds that have not run
        out. A tier is almost sold out once something has sold and what is
        left is at or under the admin's threshold (by default the larger of 5
        places and 10% of capacity), and closed when the organizer closed it
        or its sales ended with places left. An event is sold out when every
        tier it shows is, closed when none can still sell but not all of them
        sold out, almost sold out when its cheapest tier still selling is or
        when what is left across its tiers is under the threshold of their
        combined capacity, and unlimited when every tier still selling has no
        capacity.
      required: [state, left]
      properties:
        state:
          type: string
          enum: [available, almost_sold_out, sold_out, unlimited, closed]
        left:
          type: [integer, 'null']
          description: |
            The exact number left, only when it is at or under the admin's
            setting (10 by default) — "Only 4 left". Null above it, when sold
            out, and when unlimited: nothing larger ever leaves the API.

    CategoryPlace:
      type: object
      required: [category, slug, events, cover_url]
      properties:
        category: { type: string }
        slug: { type: string, description: 'Its address on the site: /events/category/{slug}.' }
        events: { type: integer, description: Nights coming up in it. }
        cover_url:
          type: [string, 'null']
          format: uri
          description: The poster of its next night that has one, a featured night first. Null when none has.

    CityPlace:
      type: object
      description: One for each slug; every spelling of the city is counted under the one most of its nights use.
      required: [city, country, slug, events, cover_url]
      properties:
        city: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        slug: { type: string, description: 'Its address on the site: /events/city/{slug}.' }
        events: { type: integer, description: Nights coming up in it. }
        cover_url: { type: [string, 'null'], format: uri }

    Discovery:
      type: object
      required: [featured, upcoming, today, weekend, later, almost_sold_out, sold_out, past, categories, cities, totals, fees]
      properties:
        featured:
          type: array
          description: Flagged by the platform; the next nights when nothing is.
          items: { $ref: '#/components/schemas/EventSummary' }
        upcoming: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
        today: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
        weekend: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
        later:
          type: array
          description: Still to come after today and outside this weekend, soonest first — upcoming without what today and weekend show.
          items: { $ref: '#/components/schemas/EventSummary' }
        almost_sold_out: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
        sold_out:
          type: array
          description: Every ticket gone. Still to come first (each takes waitlist names), then nights over in the last 30 days — ends_at tells them apart.
          items: { $ref: '#/components/schemas/EventSummary' }
        past:
          type: array
          description: Ended in the last 90 days, most recent first.
          items: { $ref: '#/components/schemas/EventSummary' }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryPlace' } }
        cities: { type: array, items: { $ref: '#/components/schemas/CityPlace' } }
        totals:
          type: object
          required: [upcoming, cities]
          properties:
            upcoming: { type: integer }
            cities: { type: integer, description: 'Counted as the city cards are: once for each slug.' }
        fees:
          type: object
          required: [service_charge]
          properties:
            service_charge:
              type: object
              description: The buyer's service charge in each currency, as a percentage written for a person ("8", "8.5").
              additionalProperties: { type: string }

    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [organizer, ticket_types, other_dates, perks, share_offer, notify_on_sale, pay_later]
          properties:
            description:
              type: [string, 'null']
              description: |
                Formatted HTML, already sanitized to an allowlist: paragraphs,
                breaks, bold, italic, underline, strikethrough, lists, h2, h3,
                blockquote, and links (http, https, mailto) forced to open in a
                new tab. Safe to render as markup. Null when there is none.
            description_text:
              type: [string, 'null']
              description: |
                The same description as plain words, for anywhere markup cannot
                be rendered: meta descriptions, link previews, structured data,
                push notifications. Never contains tags or entities.
            ends_at: { type: [string, 'null'], format: date-time }
            venue:
              oneOf:
                - $ref: '#/components/schemas/Venue'
                - type: 'null'
            dress_code: { type: [string, 'null'] }
            subdivision: { type: [string, 'null'] }
            min_age: { type: [integer, 'null'] }
            id_required: { type: boolean }
            og_image_url:
              type: [string, 'null']
              format: uri
              description: |
                The banner cropped to exactly 1200x630, which is what Facebook,
                LinkedIn and Slack read when a link is shared. Distinct from
                poster_url, which is a different shape and would be cropped by
                whichever of them is doing the cropping.
            gallery:
              type: array
              description: |
                Photographs from the night, added after it. Empty before.
              items: { $ref: '#/components/schemas/GalleryImage' }
            organizer: { $ref: '#/components/schemas/OrganizerBrand' }
            saved:
              type: boolean
              description: |
                Whether the reader holding this token saved the event. False
                for a guest. There is deliberately no count: saving is a
                private list, not applause, so a quiet night never advertises
                how quiet it is.
            add_ons:
              type: array
              description: |
                What is sold beside a ticket and admits nobody. Only what is
                on sale; a closed one is not offered and not admitted to
                exist. Empty when the event sells nothing extra.
              items: { $ref: '#/components/schemas/AddOn' }
            questions:
              type: array
              description: |
                What the organizer asks at checkout. Empty when they ask
                nothing — a list, never a missing key, so a client cannot
                mistake 'asks nothing' for 'old server'.
              items: { $ref: '#/components/schemas/Question' }
            ticket_types:
              type: array
              items: { $ref: '#/components/schemas/TicketType' }
            # Each feature's own field, always present: null, false or an
            # empty list when it has nothing to say (EventExtras).
            other_dates:
              description: |
                The other dates of a repeating night that are on sale, soonest
                first. Null for a night that does not repeat.
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/OtherDate' }
                - type: 'null'
            perks:
              type: array
              description: What Fiesta Points buy at this night. Empty when it offers nothing.
              items: { $ref: '#/components/schemas/Perk' }
            share_offer:
              description: The friend discount this night offers, or null for none.
              oneOf:
                - $ref: '#/components/schemas/ShareOffer'
                - type: 'null'
            notify_on_sale:
              type: boolean
              description: |
                Whether to offer "Tell me when tickets go on sale": the night is
                on and still to come, and nothing is on sale yet.
            pay_later:
              description: Whether the night can be paid for later, and with whom. Null when it cannot.
              oneOf:
                - $ref: '#/components/schemas/PayLater'
                - type: 'null'

    HeldTicket:
      type: object
      required: [id, code, status, admits, admitted, qr, perks, share_link, transferable]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: |
            What the door scans, and what gets read aloud when a camera will
            not focus. The alphabet excludes characters that are misheard.
        type: { type: [string, 'null'] }
        holder: { type: [string, 'null'] }
        status: { type: string }
        admits:
          type: integer
          description: How many people this one lets in — a Couple admits 2.
        admitted:
          type: integer
          description: |
            How many of them are already inside. A table arriving in two groups
            needs this, or the second half thinks the ticket is spent.
        qr:
          type: string
          description: |
            SVG markup, drawn by the server from the code. The white ground is
            part of the symbol: a QR rendered transparently over a dark theme
            inverts and will not scan.
        perks: { $ref: '#/components/schemas/TicketPerks' }
        share_link: { $ref: '#/components/schemas/TicketShareLink' }
        transferable: { $ref: '#/components/schemas/TicketTransferable' }

    TicketAccess:
      type: object
      required: [reference, status, event, tickets]
      properties:
        extras:
          type: array
          description: |
            What else was on the order. An add-on has no code and nothing to
            scan, so this screen is the only evidence its buyer holds.
          items:
            type: object
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer }
        reference:
          type: [string, 'null']
          description: The order's reference. Null on a ticket somebody was sent, where it would look up what the buyer paid.
        status:
          type: [string, 'null']
          description: The order's status. Null on a ticket somebody was sent.
        buyer_name: { type: [string, 'null'] }
        sent:
          type: boolean
          description: |
            Whether this is one ticket somebody was sent, opened by the link
            that came with it, rather than an order's own page.
        event:
          type: object
          required: [slug, title, starts_at, timezone, organizer]
          properties:
            slug: { type: string }
            title: { type: string }
            starts_at: { type: string, format: date-time }
            timezone: { type: string }
            venue: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            city: { type: string }
            min_age: { type: [integer, 'null'] }
            id_required: { type: boolean }
            organizer: { type: string }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/HeldTicket' }
        receipt:
          description: The order's receipt. Null on a ticket somebody was sent, who did not pay for it.
          oneOf:
            - $ref: '#/components/schemas/Receipt'
            - type: 'null'

    Receipt:
      type: object
      description: |
        What was paid, to whom, and each tax on it — the same receipt the
        confirmation email carries. Read from the order's own copy of how it
        was priced, so it says what was charged at the time, whatever the
        rates and settings are now. Never carries a ticket code.

        Adds up: subtotal, less discount, plus every tax not marked included,
        plus the service charge, is the total.
      required: [reference, issued_at, currency, seller_of_record, seller, lines, subtotal, discount, taxes, service_charge, total, tax_included, refunded]
      properties:
        reference: { type: string }
        issued_at: { type: string, format: date-time }
        currency: { type: string }
        seller_of_record:
          type: string
          enum: [organizer, platform]
          description: Who sold the tickets, in law, when the order was placed.
        seller: { $ref: '#/components/schemas/ReceiptParty' }
        service:
          description: |
            Who sold the booking service — the service charge — where that is
            not the seller of the tickets. Null where the platform sold
            everything, or there was no service charge.
          oneOf:
            - $ref: '#/components/schemas/ReceiptParty'
            - type: 'null'
        organizer:
          type: [string, 'null']
          description: The organizer, named where the platform was the seller.
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, unit_price, discount, amount]
            properties:
              name: { type: string }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              discount: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        taxes:
          type: array
          items: { $ref: '#/components/schemas/TaxLine' }
        service_charge:
          $ref: '#/components/schemas/Money'
          description: |
            Before any tax added to it. Where prices include tax, as in
            Nigeria, the tax is inside this figure and its line is marked
            included.
        total: { $ref: '#/components/schemas/Money' }
        tax_included:
          type: boolean
          description: Whether the prices on it already contain their tax.
        refunded:
          $ref: '#/components/schemas/Money'
          description: Money given back since, if any.

    ReceiptParty:
      type: object
      required: [name, address, registrations]
      properties:
        name: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        registrations:
          type: array
          description: The registration numbers the taxes it charged are filed under. Only those that exist.
          items:
            type: object
            required: [label, number]
            properties:
              label: { type: string, description: 'GST/HST, QST, VAT (TIN)' }
              number: { type: string }

    TaxLine:
      type: object
      description: One tax, with its own rate. Quebec with QST collected has GST and QST side by side.
      required: [name, rate, on, included, amount]
      properties:
        name: { type: string, description: 'GST, HST, QST, VAT' }
        rate:
          type: string
          description: A percentage as written — "5", "9.975", "13", "7.5".
        on:
          type: string
          enum: [tickets, service_charge]
        included:
          type: boolean
          description: Inside the price it was charged on, rather than added to it.
        amount: { $ref: '#/components/schemas/Money' }

    GalleryImage:
      type: object
      required: [url, thumb_url]
      properties:
        url: { type: string, format: uri }
        thumb_url: { type: string, format: uri }
        # Doubles as alt text. A caption an organizer actually writes is worth
        # more to a screen reader than an alt field they leave empty.
        caption: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }

    OrganizerRef:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }

    OrganizerBrand:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'], format: uri }
        is_verified: { type: boolean }
        following:
          type: boolean
          description: |
            Whether the reader holding this token follows the organizer. False
            for a guest. An organizer may be told how many follow them; who is
            never published, here or anywhere.

    OrganizerPage:
      allOf:
        - $ref: '#/components/schemas/OrganizerBrand'
        - type: object
          required: [upcoming, past, past_has_more, socials]
          properties:
            upcoming:
              type: array
              description: |
                Their published nights still to come, soonest first.
              items: { $ref: '#/components/schemas/EventSummary' }
            past:
              type: array
              description: |
                The most recent nights that have already happened, newest
                first, twelve at most. What a stranger deciding whether to
                trust a name actually reads.
              items: { $ref: '#/components/schemas/EventSummary' }
            past_has_more:
              type: boolean
              description: |
                Whether there are older nights than `past`, from
                GET /api/organizers/{slug}/events?when=past&page=2 on.
            socials:
              type: array
              description: |
                Where else to find them, in the order a page shows them, with
                anything that cannot be read as an account left off. Empty
                when there is none.
              items: { $ref: '#/components/schemas/SocialLink' }

    Venue:
      type: object
      required: [name]
      properties:
        name: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        city: { type: [string, 'null'] }

    TicketType:
      type: object
      required: [id, name, price, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        admits: { type: integer, minimum: 1 }
        max_per_order: { type: [integer, 'null'] }
        remaining:
          type: [integer, 'null']
          description: |
            The same as availability.left: a number only at or under the
            admin's setting, null otherwise — including when unlimited. The
            public payload never carries the capacity or how many sold.
        sold_out:
          type: boolean
          description: Every place taken, holds counted, or marked sold out.
        availability: { $ref: '#/components/schemas/Availability' }
        status:
          type: string
          enum: [on_sale, sold_out, hidden, closed]

    AddOn:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        max_per_order: { type: [integer, 'null'] }
        remaining:
          type: [integer, 'null']
          description: |
            What is genuinely left, counted with the baskets in progress.
            Null where there is no limit.
        sold_out: { type: boolean }

    Question:
      type: object
      required: [id, label, type, required, per_attendee]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        type:
          type: string
          enum: [text, choice, multi_choice, boolean]
        options:
          type: array
          description: What may be chosen. Empty for a question that is typed into.
          items: { type: string }
        required: { type: boolean }
        per_attendee:
          type: boolean
          description: |
            Asked once for the whole order, or once about each person on it.
            A name for the door is per attendee; how somebody heard about the
            night is not.

    QuoteRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [ticket_type_id, quantity]
            properties:
              ticket_type_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        code:
          type: [string, 'null']
          description: A discount code, typed by the buyer.
        access_code:
          type: [string, 'null']
          description: A presale code, opening ticket types that are hidden or not yet on sale.
        ref:
          type: [string, 'null']
          description: Promoter attribution captured from the link.
        add_ons:
          type: array
          description: |
            Things sold with a ticket that are not one: a table, a bottle, a
            shirt. Bought alongside and never instead of — a basket of
            add-ons and no tickets is refused.
          items:
            type: object
            required: [add_on_id, quantity]
            properties:
              add_on_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }

    Quote:
      type: object
      required: [subtotal, discount, tax, total, lines]
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        tax_label:
          type: [string, 'null']
          description: What the buyer is shown — HST, GST, VAT, or "GST + QST" in Quebec while QST is collected.
        tax_lines:
          type: array
          description: Each tax on its own — on the tickets, and on the service charge where it is taxed.
          items: { $ref: '#/components/schemas/TaxLine' }
        service_charge_tax:
          $ref: '#/components/schemas/Money'
          description: How much of the service charge is tax on it. Zero unless the service charge is taxed.
        tax_inclusive:
          type: boolean
          description: Whether tax was already inside the displayed price.
        code_applied:
          type: [string, 'null']
          description: |
            The code the buyer typed, to show as applied and removable. Null
            for a friend's discount, which is shown as `friend_discount` rather
            than as a code.
        access_code_applied:
          type: [string, 'null']
          description: The presale code that opened a locked ticket type in this basket.
        pay_later:
          description: Whether this basket can be paid for later, and with whom. Null when it cannot.
          oneOf:
            - $ref: '#/components/schemas/PayLaterQuote'
            - type: 'null'
        friend_discount:
          description: The discount a friend's link took off this basket, or null for none.
          oneOf:
            - $ref: '#/components/schemas/FriendDiscount'
            - type: 'null'
        code_applies_to:
          type: [array, 'null']
          items: { type: string }
          description: The ticket types the applied code discounts; null when it discounts every type.
        availability:
          type: array
          description: |
            How each tier on the event, and each in the basket, is selling now
            — so a ticket page can say one sold out or closed while somebody
            chose, before checkout refuses it. A hidden tier is reported only
            when the request's code opens it. The quote still reserves nothing.
          items:
            allOf:
              - $ref: '#/components/schemas/Availability'
              - type: object
                required: [ticket_type_id]
                properties:
                  ticket_type_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [kind, name, unit_price, quantity, line_total]
            properties:
              kind:
                type: string
                enum: [ticket, add_on]
                description: |
                  Which of the two this line is, said rather than inferred
                  from a null. A client counting people to ask questions of
                  must not count bottles.
              ticket_type_id: { type: [string, 'null'], format: uuid }
              add_on_id: { type: [string, 'null'], format: uuid }
              name: { type: string }
              unit_price: { $ref: '#/components/schemas/Money' }
              quantity: { type: integer }
              line_total: { $ref: '#/components/schemas/Money' }
              discount:
                $ref: '#/components/schemas/Money'
                description: This line's share of the order's discount.

    CreateOrderRequest:
      allOf:
        - $ref: '#/components/schemas/QuoteRequest'
        - type: object
          required: [buyer, accept_terms]
          properties:
            accept_terms:
              type: boolean
              const: true
              description: |
                The buyer ticked the box agreeing to the terms, the privacy
                policy and the refund policy. Refused with a 422 without it.
                The order keeps which version was agreed to, and when. This
                endpoint reads no sign-in, so every caller sends it, whatever
                token it carries.
            buyer:
              type: object
              description: |
                Who the tickets are for. Nested, because it is one person:
                the spec described three flat fields the API has never
                accepted, so a generated client encoded a body that could not
                be posted.
              required: [name, email]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: [string, 'null'], maxLength: 32 }
            answers:
              type: object
              description: |
                What the buyer answered for the order as a whole, keyed by
                question id — the questions on the event with per_attendee
                false. Which of them must be answered is decided by the
                server against its own rows, never against the form a client
                rendered.
              additionalProperties: true
            attendees:
              type: array
              description: |
                One entry per ticket, in the order they were filled in, when
                the event asks something of each person. The position within
                a ticket type is the position of the ticket it belongs to, so
                the counts here have to match the quantities in items.
              items:
                type: object
                required: [ticket_type_id]
                properties:
                  ticket_type_id: { type: string, format: uuid }
                  answers:
                    type: object
                    additionalProperties: true
            embedded:
              type: boolean
              description: |
                Placed inside an organizer's own website through the embed.
                A label for their reports; it changes nothing about the sale.
            retry_of:
              type: [string, 'null']
              maxLength: 16
              description: |
                The reference a 502 came back with, when the payment page
                could not be opened for the last press. That attempt, if it
                is still an unpaid order of this event with no payment page,
                is closed and its hold passed to the new order in the same
                transaction, so a retry never holds the same places twice. A
                reference that is anything else is ignored.
            # No return_url. The spec used to declare one and the API has
            # never read it: where a buyer lands after paying is built from
            # the platform's own PUBLIC_URL, which is what keeps it from being
            # somewhere a request asked for.

    OrderCreated:
      type: object
      required: [order, payment]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        payment:
          description: Null for a zero-total order, which needs no gateway.
          oneOf:
            - $ref: '#/components/schemas/PaymentHandoff'
            - type: 'null'

    PaymentHandoff:
      type: object
      required: [gateway, checkout_url]
      properties:
        gateway:
          type: string
          enum: [stripe, paystack]
          description: Routed by event currency. NGN goes to Paystack.
        checkout_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    Order:
      type: object
      required: [id, reference, status, currency, subtotal, discount, tax, total]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [pending, paid, failed, cancelled, refunded, partially_refunded]
        currency: { type: string, minLength: 3, maxLength: 3 }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        buyer_email: { type: string, format: email }
        buyer_name: { type: string }
        paid_at: { type: [string, 'null'], format: date-time }
        event: { $ref: '#/components/schemas/EventSummary' }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }

    Ticket:
      type: object
      required: [id, code, status, event, perks, share_link, transferable]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: |
            What the QR encodes. Cryptographically random and unique. Codes
            imported from the previous platform keep their original format, so
            tickets already sitting in inboxes still scan.
        status:
          type: string
          enum: [valid, checked_in, transferred, refunded, void]
        holder_name: { type: [string, 'null'] }
        ticket_type_name: { type: string }
        checked_in_at: { type: [string, 'null'], format: date-time }
        pdf_url: { type: [string, 'null'], format: uri }
        apple_wallet_url: { type: [string, 'null'], format: uri }
        google_wallet_url: { type: [string, 'null'], format: uri }
        event: { $ref: '#/components/schemas/EventSummary' }
        receipt:
          description: |
            The receipt for the order this ticket came from, only to the
            account that bought it. Null on a ticket somebody passed on, and
            on a comp.
          oneOf:
            - $ref: '#/components/schemas/Receipt'
            - type: 'null'
        perks: { $ref: '#/components/schemas/TicketPerks' }
        share_link: { $ref: '#/components/schemas/TicketShareLink' }
        transferable: { $ref: '#/components/schemas/TicketTransferable' }

    # What each feature adds to a ticket, wherever a ticket is shown (the
    # phone's list and the buyer's link), always present (TicketExtras).
    TicketPerks:
      type: array
      description: The perks the holder has claimed with Fiesta Points for this night. Empty when none.
      items: { $ref: '#/components/schemas/ClaimedPerk' }

    TicketShareLink:
      description: The holder's own friend-discount link for this night, or null when the night has no offer.
      oneOf:
        - $ref: '#/components/schemas/ShareLink'
        - type: 'null'

    TicketTransferable:
      type: [boolean, 'null']
      description: |
        Whether the ticket can be sent to somebody else from here. Null when
        the server does not say, and a client decides as it did before.

    ScanResult:
      type: object
      required: [result, accepted, admitted, remaining, message]
      properties:
        client_id:
          type: string
          format: uuid
          description: Present on sync results, to match each back to its queued scan.
        result:
          type: string
          enum: [accepted, duplicate, not_found, wrong_event, void, over_capacity, choose_party]
          description: |
            The server's verdict. A refusal is a normal outcome, not an error,
            so the scanner can show it without treating it as a failure.
            `choose_party` is not a verdict: a ticket with more than one place
            left, scanned without `party`. Nobody was admitted and nothing was
            recorded; `remaining` and `ticket` say what to ask. The ticket's
            checkout answers are left out of it, and come with the scan that
            answers it. Never returned by the sync endpoint, where no `party`
            keeps meaning everyone outstanding.
        accepted:
          type: boolean
          description: Whether anybody went in on this scan.
        admitted:
          type: integer
          description: How many this scan let in. A table can arrive in parts.
        remaining:
          type: integer
          description: How many of the ticket's party are still outside afterwards.
        message:
          type: string
          description: Written for the person on the door.
        offline_result:
          type: [string, 'null']
          description: What the door decided with no signal; null for an online scan.
        conflict:
          type: [string, 'null']
          enum: [admitted_invalid, refused_valid, null]
          description: |
            Where the offline door and the server disagreed. admitted_invalid:
            let in on a ticket already used or not valid. refused_valid: turned
            away on a ticket that was fine.
        ticket:
          description: Null for a ticket belonging to another event.
          oneOf:
            - type: object
              properties:
                holder_name: { type: [string, 'null'] }
                type: { type: [string, 'null'] }
                admits: { type: integer }
                admitted_count: { type: integer }
            - type: 'null'

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, failing] }
        checks:
          type: object
          description: One entry per part, in the order they are asked.
          required: [database, cache, queue, storage, scheduler]
          properties:
            database: { $ref: '#/components/schemas/ReadinessCheck' }
            cache: { $ref: '#/components/schemas/ReadinessCheck' }
            queue:
              description: A worker has run the heartbeat job in the last ten minutes, and fewer than ten jobs failed in the last hour.
              allOf:
                - $ref: '#/components/schemas/ReadinessCheck'
            storage: { $ref: '#/components/schemas/ReadinessCheck' }
            scheduler:
              description: The scheduler has run in the last three minutes.
              allOf:
                - $ref: '#/components/schemas/ReadinessCheck'

    ReadinessCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail:
          type: string
          description: |
            A fixed sentence, only when `ok` is false. Never an exception's
            message, a host name or a count of anything.

    Contact:
      type: object
      description: Every field but `addresses` and `complete` is null when it is not set.
      required: [company_name, company_number, support_email, privacy_email, phone, addresses, complete]
      properties:
        company_name:
          type: [string, 'null']
          description: The registered legal name, not the brand.
        company_number:
          type: [string, 'null']
          description: A Canadian corporation number, a CAC RC number — shown as written.
        support_email: { type: [string, 'null'], format: email }
        privacy_email:
          type: [string, 'null']
          format: email
          description: For requests about personal data. The support inbox when there is no other.
        phone:
          type: [string, 'null']
          description: Null rather than a number nobody answers.
        addresses:
          type: array
          description: Where post reaches the operator, one per market that has one.
          items:
            type: object
            required: [country, address]
            properties:
              country: { type: string, enum: [CA, NG] }
              address: { type: string }
        complete:
          type: boolean
          description: |
            A registered name, a support inbox and at least one address are
            all set. The legal pages show a notice while it is false.

    SignUpRequest:
      type: object
      required: [name, email, password, password_confirmation, accept_terms]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 190 }
        password:
          type: string
          minLength: 10
          description: At least ten characters, with letters and numbers.
        password_confirmation: { type: string }
        organization:
          type: [string, 'null']
          maxLength: 120
          description: |
            The events page to open. Required unless `attendee` is true or
            this is joining by `invitation`.
        invitation:
          type: [string, 'null']
          maxLength: 64
          description: The token from an invitation to join an organization. The email must be the one it was sent to.
        attendee:
          type: [boolean, 'null']
          description: Going out rather than putting something on. Said, never inferred from a missing organization.
        device:
          type: [string, 'null']
          maxLength: 64
          description: Names the session a joined-by-invitation sign-up is answered with.
        accept_terms:
          type: boolean
          const: true
          description: |
            The box on the form: the terms, the privacy policy and the refund
            policy, agreed to. Refused with a 422 without it. The account keeps
            which version was agreed to, and when.

    SignUpPending:
      type: object
      required: [message, pending]
      properties:
        message: { type: string }
        pending: { type: boolean, const: true }

    Session:
      type: object
      description: The same shape signing in answers with, whichever way the session started.
      required: [token, user, abilities, organizations]
      properties:
        token: { type: string }
        user:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            avatar_url:
              type: [string, 'null']
              format: uri
              description: |
                The account's photo, 256 pixels square, or null for initials.
                Sent by signing in; an account just made by invitation has none.
            timezone:
              type: [string, 'null']
              description: |
                The IANA zone the account chose, or null to use the device's
                own. Sent by signing in.
        abilities:
          type: array
          description: Decided by the server from what the account is. The phone opens its attendee or organizer half from these.
          items: { type: string }
        organizations:
          type: array
          items: { $ref: '#/components/schemas/Membership' }

    Membership:
      type: object
      required: [id, name, slug, role, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, manager, finance, marketing, door] }
        permissions:
          type: array
          description: Resolved by the server from the role. Clients read this and never derive it.
          items: { type: string }

    EmailVerificationAnswer:
      type: object
      required: [message, verified]
      properties:
        message:
          type: string
          description: Written for the person, naming the address the link went to.
        verified: { type: boolean }

    TermsStanding:
      type: object
      required: [current, accepted, accepted_version, accepted_at]
      properties:
        current:
          type: string
          description: The version in force now.
        accepted:
          type: boolean
          description: Whether this account agreed to that version. An older one does not count.
        accepted_version:
          type: [string, 'null']
          description: What it last agreed to, or null when it never has.
        accepted_at:
          type: [string, 'null']
          format: date-time
          description: When it first agreed to `accepted_version`.

    AccountErasurePreview:
      type: object
      required: [email, email_verified, refused, organizations, kept_for_years, history_kept]
      properties:
        email: { type: string, format: email }
        email_verified:
          type: boolean
          description: A proved address is deleted on the password; any other is sent a link first.
        refused:
          type: [string, 'null']
          description: |
            Why it cannot be deleted yet, written for the person: the only
            owner of an organization, until it has another owner or is closed,
            or myFiesta staff access, until another administrator removes it.
            Null when nothing stands in the way.
        organizations:
          type: array
          description: The organizations the person would leave.
          items:
            type: object
            required: [id, name, slug, role, only_owner]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              role: { type: string, enum: [owner, manager, finance, marketing, door] }
              only_owner: { type: boolean }
        kept_for_years:
          type: integer
          description: How long orders and the ledger are kept after, with nobody's name on them.
        history_kept:
          type: boolean
          description: |
            Whether the audit trail names them — a refund sent, a price
            changed. That stays under the name they had then: nobody can edit
            that trail.

    AccountErasureResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [completed, pending, refused] }
        message:
          type: string
          description: Written for the person. `completed` has signed out every device, this one included.

    EventStatus:
      type: string
      enum: [draft, in_review, published, cancelled]
      description: |
        Draft while it is built; in_review while myFiesta looks at it, when it
        cannot be changed; published once approved, the only state that
        sells; cancelled for good.

    EventReviewResult:
      type: object
      required: [status, outcome, message]
      properties:
        status: { $ref: '#/components/schemas/EventStatus' }
        outcome:
          type: string
          enum: [in_review, published, withdrawn, unpublished, already]
          description: |
            in_review sent to the queue; published straight on sale with an
            approval that still stands; withdrawn taken back from review;
            unpublished taken off sale; already nothing to do.
        message:
          type: string
          description: One plain sentence for the person who pressed the button.

    EventReviewRefusal:
      type: object
      required: [message]
      properties:
        message: { type: string }
        reasons:
          type: array
          items: { type: string }
          description: Every reason the event is not ready, one sentence each.
        code:
          type: string
          enum: [event_in_review, organization_suspended, email_unverified]

    EventReviewStep:
      type: object
      required: [action, via, reason, at, by]
      properties:
        action: { type: string, enum: [submitted, approved, rejected, withdrawn] }
        via:
          type: [string, 'null']
          enum: [review, takedown_lifted, suspension_lifted, series, existing, imported, null]
          description: How an approval came about. Null for other steps.
        reason:
          type: [string, 'null']
          description: The reviewer's words, exactly as sent, on a rejection.
        at: { type: string, format: date-time }
        by:
          type: [string, 'null']
          description: A member of the organization, or myFiesta for a decision.

    EventReviewState:
      type: object
      description: Where an event stands with myFiesta's review, on the console's event.
      required: [submitted_at, approved_at, on_submit, unchanged_since_approval, not_ready, rejection, history]
      properties:
        submitted_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        on_submit:
          type: [string, 'null']
          enum: [publish, review, null]
          description: What sending it now would do. Null when it is not a draft that can be sent.
        unchanged_since_approval:
          type: boolean
          description: What a buyer sees is still what was last approved. For an event on sale, taken off now it could go straight back on.
        not_ready:
          type: array
          items: { type: string }
        rejection:
          oneOf:
            - type: object
              required: [reason, at]
              properties:
                reason: { type: string }
                at: { type: string, format: date-time }
            - type: 'null'
        history:
          type: array
          items: { $ref: '#/components/schemas/EventReviewStep' }

    SavedViewList:
      type: string
      description: Which console list a view is of.
      enum: [orders, event-orders, codes, event-codes, guests, campaigns, payouts, events]
    SavedView:
      type: object
      required: [id, list, name, state, updated_at]
      properties:
        id: { type: string, format: uuid }
        list: { $ref: '#/components/schemas/SavedViewList' }
        name: { type: string }
        state:
          type: object
          additionalProperties: true
          description: The console's own shape — filters, sort, columns. Always an object, empty included.
        updated_at: { type: string, format: date-time }
    OrganizationStanding:
      type: object
      required: [organization, suspended, suspension]
      properties:
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        suspended: { type: boolean }
        suspension:
          description: Null while the organization is in good standing.
          oneOf:
            - type: object
              required: [since, reason, support_email]
              properties:
                since: { type: [string, 'null'], format: date-time }
                reason:
                  type: [string, 'null']
                  description: Only when myFiesta chose to share it.
                support_email:
                  type: [string, 'null']
                  format: email
                  description: Null when the deployment has none.
            - type: 'null'

    PayoutStatement:
      type: object
      required: [currency, balance, settled, overdraft, events, settlements, destination, requests, can_request, can_change_destination]
      properties:
        currency: { type: string, enum: [CAD, NGN] }
        balance:
          $ref: '#/components/schemas/Money'
          description: Below zero while the organization owes myFiesta money; see `overdraft`.
        settled: { $ref: '#/components/schemas/Money' }
        overdraft:
          description: Null when nothing is owed back and no advance is being paid back.
          oneOf:
            - { $ref: '#/components/schemas/PayoutOverdraft' }
            - type: 'null'
        events:
          type: array
          description: The balance by the night that earned it. Adds up to `balance`.
          items:
            type: object
            required: [event_id, title, starts_at, balance, gross, settled]
            properties:
              event_id: { type: [string, 'null'], format: uuid }
              title: { type: string }
              starts_at: { type: [string, 'null'], format: date-time }
              balance: { $ref: '#/components/schemas/Money' }
              gross: { $ref: '#/components/schemas/Money' }
              settled: { $ref: '#/components/schemas/Money' }
        settlements:
          type: array
          description: What was sent, newest first. `overdraft` means part of it was advanced.
          items:
            type: object
            required: [id, amount, rail, type, status, note, event, settled_at]
            properties:
              id: { type: string, format: uuid }
              amount: { $ref: '#/components/schemas/Money' }
              rail: { type: string, enum: [interac, bank_transfer, stripe, paystack] }
              type: { type: string, enum: [full, partial, overdraft] }
              status: { type: string }
              note: { type: [string, 'null'] }
              event:
                oneOf:
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                  - type: 'null'
              settled_at: { type: [string, 'null'], format: date-time }
        destination:
          description: Where payouts go, masked. Never more of an account number than its last four digits.
          oneOf:
            - type: object
              properties:
                rail: { type: string, enum: [interac, bank_transfer] }
                currency: { type: string }
                interac_email: { type: [string, 'null'] }
                bank_name: { type: [string, 'null'] }
                account_name: { type: [string, 'null'] }
                account_last_four: { type: [string, 'null'] }
                verified_at: { type: [string, 'null'], format: date-time }
            - type: 'null'
        requests:
          type: array
          description: Payout requests, newest first.
          items: { $ref: '#/components/schemas/PayoutRequestRow' }
        can_request: { type: boolean }
        can_change_destination: { type: boolean }

    PayoutOverdraft:
      type: object
      description: |
        Money owed back to myFiesta in the statement's currency, and how it is
        coming back. The parts add up: advanced − repaid − recovered + added =
        outstanding.
      required: [outstanding, advanced, advanced_at, recovered, repaid, added, since, summary, recovery]
      properties:
        outstanding:
          $ref: '#/components/schemas/Money'
          description: Owed to myFiesta now. Zero once it has been paid back.
        advanced:
          description: How much myFiesta advanced. Null when refunds, not an advance, took the balance below zero.
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - type: 'null'
        advanced_at: { type: [string, 'null'], format: date-time }
        recovered:
          $ref: '#/components/schemas/Money'
          description: Paid back by sales since.
        repaid:
          $ref: '#/components/schemas/Money'
          description: Paid back by a transfer to myFiesta since.
        added:
          $ref: '#/components/schemas/Money'
          description: Put on top by refunds and chargebacks since.
        since: { type: [string, 'null'], format: date-time }
        summary:
          type: string
          description: The whole position in one sentence, the same one myFiesta staff read.
        recovery:
          type: [string, 'null']
          description: What pays it back, while anything is outstanding.

    PayoutRequestRow:
      type: object
      required: [id, amount, paid_amount, advance, status, note, decision_note, requested_by, requested_at, decided_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        paid_amount:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - type: 'null'
        advance:
          description: The part of the payment myFiesta advanced beyond what was owed, when it did.
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - type: 'null'
        status: { type: string, enum: [pending, paid, rejected, cancelled] }
        note: { type: [string, 'null'] }
        decision_note:
          type: [string, 'null']
          description: Written by staff for the organizer.
        requested_by: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }

    # Each feature added since writes its schemas under its own anchor, so two
    # features never edit the same lines of this file. The shapes the event
    # page and a ticket already point at (EventExtras, TicketExtras) start
    # here as open objects, for each feature to fill in.
    # --- track: pay ---
    PayLater:
      type: object
      description: |
        Who a buyer can pay a night later with, on Stripe's payment page. Never
        an instalment amount: the lender quotes those on its own page.
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PayLaterProvider' }
    PayLaterQuote:
      type: object
      description: |
        Whether this basket can be paid for later, and with whom. Not
        eligible, naming nobody, when the night offers it but no lender takes
        an order this size (Klarna C$1-1,500, Affirm C$50-30,000).
      required: [eligible, providers]
      properties:
        eligible: { type: boolean }
        providers:
          type: array
          items: { $ref: '#/components/schemas/PayLaterProvider' }
    PayLaterProvider:
      type: string
      enum: [klarna, affirm]
    PayLaterRate:
      type: object
      description: A processor's published rate, in basis points of the order plus a flat amount in minor units.
      required: [bps, flat]
      properties:
        bps: { type: integer }
        flat: { type: integer }
    PayLaterSetting:
      type: object
      required: [enabled, available, offered_now, max_days_before_event, currency, fees]
      properties:
        enabled:
          type: boolean
          description: Whether the organizer has opted the night in.
        available:
          type: boolean
          description: Whether myFiesta offers paying later on this night at all (switched on, priced in CAD).
        offered_now:
          type: boolean
          description: Whether a buyer would be offered it today, which also needs the night to be near enough.
        max_days_before_event:
          type: integer
          description: How many days before the night buyers start being offered it.
        currency: { type: string }
        fees:
          type: object
          description: What a card costs and what each lender does; the organizer pays the difference.
          required: [card, klarna, affirm]
          properties:
            card: { $ref: '#/components/schemas/PayLaterRate' }
            klarna: { $ref: '#/components/schemas/PayLaterRate' }
            affirm: { $ref: '#/components/schemas/PayLaterRate' }
    # --- track: transfer ---
    TicketTransferRequest:
      type: object
      description: Who a ticket is going to. The address finds their account however it is typed.
      required: [email, name]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        name: { type: string, maxLength: 120 }
    TicketTransferAnswer:
      type: object
      required: [message, access]
      properties:
        message:
          type: string
          description: What was done, to show the person who did it.
        access:
          $ref: '#/components/schemas/TicketAccess'
          description: |
            The link's page as it now is: without the ticket that went. On
            the link a ticket was sent with, that is a page with no tickets
            left on it, the link having closed.
    # --- track: profile ---
    Account:
      type: object
      description: The signed-in person, as GET /api/auth/me has them now.
      required: [name, email, email_verified, phone, timezone, avatar_url, organizations]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        email_verified:
          type: boolean
          description: |
            Whether the address is proved. Until it is, putting an event on
            sale, asking to be paid and changing where payouts go are refused.
        phone: { type: [string, 'null'] }
        timezone:
          type: [string, 'null']
          description: |
            The IANA zone the account chose, or null to use the device's own.
            Saved through PATCH /api/auth/profile, never guessed by the server.
        avatar_url:
          type: [string, 'null']
          format: uri
          description: The account's photo, 256 pixels square, or null for initials.
        organizations:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Membership'
              - type: object
                required: [verified]
                properties:
                  verified: { type: boolean }

    AccountPhoto:
      type: object
      description: What uploading or removing the account's photo answers with.
      required: [avatar_url]
      properties:
        avatar_url:
          type: [string, 'null']
          format: uri
          description: Where the new photo is served from, or null once it is removed.

    # --- track: public ---
    SocialLink:
      type: object
      description: |
        One place an organizer can be found besides here. The address is
        built by the API from the part that names the account, never passed
        through as typed, and a website is https only. Open it with
        rel="noopener noreferrer nofollow".
      required: [network, label, url]
      properties:
        network: { type: string, enum: [instagram, tiktok, x, facebook, website] }
        label:
          type: string
          description: |
            What the link says — @username, a Facebook page's name, or a
            website's host. A Facebook page kept by its address (one with no
            username) goes by the organizer's name. Shown after the network's
            name, never in place of it.
        url: { type: string, format: uri }

    OrganizerEvents:
      type: object
      description: One page of an organizer's nights, twelve at a time.
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EventSummary' }
        meta:
          type: object
          required: [page, per_page, has_more]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            has_more:
              type: boolean
              description: Whether the next page has anything on it.

    HelpVideo:
      type: object
      description: |
        A how-to video. Only YouTube's id for it is given; the thumbnail is
        https://i.ytimg.com/vi/{youtube_id}/hqdefault.jpg and the player
        https://www.youtube-nocookie.com/embed/{youtube_id}.
      required: [id, title, youtube_id, description, audience]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        youtube_id: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        description: { type: [string, 'null'] }
        audience:
          type: string
          enum: [buyers, organizers]
          description: Who it is for — somebody buying a ticket, or somebody running events.

    # --- track: sched ---
    OtherDate:
      type: object
      description: |
        Another date of a repeating night: on sale and still to come. An
        event page lists at most eight, soonest first.
      required: [slug, starts_at, availability]
      properties:
        slug: { type: string }
        starts_at: { type: string, format: date-time }
        availability:
          oneOf:
            - $ref: '#/components/schemas/Availability'
            - type: 'null'
    OrganizerSeries:
      type: object
      description: A repeating night as the console sees it, with its dates still to come.
      required: [id, rrule, status, timezone, source_event_id, frequency, count, until, auto_publish, on_sale_days_before, past_count, occurrences, skipped]
      properties:
        id: { type: string, format: uuid }
        rrule: { type: string, description: 'The rule in iCalendar (RFC 5545) form.' }
        status: { type: string, enum: [active, paused, ended] }
        timezone: { type: string }
        generated_through: { type: [string, 'null'], format: date-time }
        source_event_id: { type: string, format: uuid }
        frequency:
          type: [string, 'null']
          enum: [weekly, fortnightly, monthly, null]
          description: The choice that made the rule; null for a rule written some other way.
        count: { type: [integer, 'null'], description: 'Every date it runs for, the first included.' }
        until: { type: [string, 'null'], format: date, description: "Its last day, in the venue's zone." }
        auto_publish: { type: boolean, description: 'Whether each date goes on sale by itself.' }
        on_sale_days_before:
          type: [integer, 'null']
          description: How many days before its night each date goes on sale; null is as soon as it is made.
        past_count: { type: integer }
        occurrences:
          type: array
          items:
            type: object
            required: [id, slug, title, starts_at, series_occurs_at, status, moved, is_source, publish_at]
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              starts_at: { type: string, format: date-time }
              series_occurs_at: { type: string, format: date-time }
              status: { type: string }
              moved: { type: boolean }
              is_source: { type: boolean }
              publish_at:
                type: [string, 'null']
                format: date-time
                description: When a draft date goes on sale by itself.
        skipped:
          type: array
          items:
            type: object
            required: [occurs_at, reason]
            properties:
              occurs_at: { type: string, format: date-time }
              reason: { type: [string, 'null'] }
    # --- track: clone ---
    CopyAdjustments:
      type: object
      description: |
        What to change on the way to a new event made from an old one, or from
        a template. Everything left out is copied as it is.
      additionalProperties: false
      properties:
        starts_at:
          type: string
          format: date-time
          description: In the future. Copying an event without one keeps its own start.
        ends_at:
          type: string
          format: date-time
          description: After the start. Without one the new event is as long as the old.
        title: { type: string, maxLength: 160 }
        description:
          type: [string, 'null']
          maxLength: 20000
          description: Replaces the description when given, even as null or empty.
        ticket_types:
          type: array
          maxItems: 100
          description: Changes to tiers, each named by the id it has in the event or the template. A tier not listed comes across as it is.
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string }
              include:
                type: boolean
                default: true
                description: False leaves the tier out. A tier that waited for it in a price ladder opens like any other.
              name: { type: [string, 'null'], maxLength: 80 }
              price_amount:
                type: [integer, 'null']
                minimum: 0
                maximum: 100000000
                description: Minor units.
              quantity_available:
                type: [integer, 'null']
                minimum: 0
                maximum: 2147483647
                description: Null is unlimited. Not given is unchanged.
        include:
          type: object
          additionalProperties: false
          properties:
            add_ons: { type: boolean, default: true }
            questions: { type: boolean, default: true }
            reminders: { type: boolean, default: true }
    EventCopy:
      type: object
      description: |
        A new draft event, made by copying or from a template: the public
        event's fields, with its id and status for the console to open it.
      required: [id, slug, title, starts_at, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [draft] }
    EventTemplate:
      type: object
      description: |
        An event kept as a starting point. What it keeps is fixed when it is
        kept; the event it came from can change or go without touching it.
      required: [id, name, title, description, currency, timezone, city, original_starts_at, length_minutes, poster_url, ticket_types, add_ons, questions, reminders, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        title:
          type: string
          description: The title a new event starts with.
        description: { type: [string, 'null'] }
        currency: { type: string, enum: [CAD, NGN] }
        timezone: { type: string }
        city: { type: string }
        original_starts_at:
          type: [string, 'null']
          format: date-time
          description: When the night it was kept from started. A new event takes a date of its own.
        length_minutes:
          type: [integer, 'null']
          description: How long that night ran, or null when it had no end.
        poster_url: { type: [string, 'null'], format: uri }
        ticket_types:
          type: array
          items:
            type: object
            required: [id, name, price, quantity_available]
            properties:
              id:
                type: string
                description: How to name this tier when making an event from the template.
              name: { type: string }
              price: { $ref: '#/components/schemas/Money' }
              quantity_available: { type: [integer, 'null'] }
        add_ons:
          type: integer
          description: How many extras it keeps.
        questions:
          type: integer
          description: How many questions it keeps.
        reminders:
          type: integer
          description: How many reminder times it keeps.
        created_by:
          type: [string, 'null']
          description: The name of whoever kept it, while their account exists.
        created_at: { type: string, format: date-time }
    # --- track: share ---
    ShareOffer:
      type: object
      description: |
        A night's friend discount: what somebody arriving through a buyer's
        link saves on their tickets. Says nothing about who sent it.
      required: [discount_bps]
      properties:
        discount_bps:
          type: integer
          description: Basis points off each ticket (1500 is 15%).
    ShareLink:
      type: object
      description: |
        A holder's own friend-discount link to a night. A friend who buys
        through it saves `discount_bps`; once they have paid, the holder is
        emailed a single-use code worth the same off their next tickets from
        the organizer.
      required: [url, discount_bps, rewards_earned, rewards_left, organizer]
      properties:
        url:
          type: [string, 'null']
          description: |
            The link to send: the event page with `?ref=`. Null for a ticket
            somebody passed on, until its holder asks for theirs
            (POST /api/events/{slug}/share-link).
        discount_bps:
          type: integer
          description: What the friend saves, and the holder's reward, in basis points.
        rewards_earned:
          type: integer
          description: Rewards this link has earned and that still stand.
        rewards_left:
          type: integer
          description: How many more friends can earn the holder a reward.
        organizer:
          type: [string, 'null']
          description: Whose next tickets the reward is good for.
    FriendDiscount:
      type: object
      description: |
        What a friend's link took off a basket, shown as its own line rather
        than as a code the buyer typed. A code the buyer types replaces it.
      required: [discount_bps, amount]
      properties:
        discount_bps:
          type: integer
          description: Basis points off each ticket.
        amount: { $ref: '#/components/schemas/Money' }
    OrganizerShareOffer:
      type: object
      description: |
        A night's friend discount as its organizer set it, with what it has
        done so far. Always present on the organizer's event, so the console
        knows the platform's cap before an offer starts and still shows what
        an ended one did.
      required: [discount_bps, max_rewards, max_bps, links, friend_orders, rewards]
      properties:
        discount_bps:
          type: [integer, 'null']
          description: What a friend saves, and a buyer's reward, in basis points. Null while the night offers nothing.
        max_rewards:
          type: integer
          description: How many friends' orders one link earns its holder a reward for.
        max_bps:
          type: integer
          description: The most any night may offer, as myFiesta has it set.
        links:
          type: integer
          description: Links handed out for this night.
        friend_orders:
          type: integer
          description: Paid orders that came through a friend's link.
        rewards:
          type: integer
          description: Rewards standing (issued, not taken back).
    # --- track: survey ---
    SurveyQuestion:
      type: object
      description: |
        One question. `nps` is 0 to 10 ("how likely are you to recommend"),
        `rating5` 1 to 5, `single` one of `options`, `multi` any of them,
        `text` up to 2,000 characters. `options` is empty except for `single`
        and `multi`.
      required: [id, type, label, options, required]
      properties:
        id:
          type: string
          description: Fixed for the question's life, so its answers stay attached to it.
        type:
          type: string
          enum: [nps, rating5, single, multi, text]
        label: { type: string }
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
    PublicSurvey:
      type: object
      description: |
        The survey behind an emailed link: the night, the questions it was sent
        with, and whether the link has been answered. Never whose link it is.
      required: [event, questions, answered]
      properties:
        event:
          type: object
          required: [title, organizer, starts_at, timezone]
          properties:
            title: { type: string }
            organizer: { type: string }
            starts_at: { type: string, format: date-time }
            timezone: { type: string, description: The night's own zone (IANA). }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SurveyQuestion' }
        answered:
          type: boolean
          description: True once this link has been answered. It cannot be answered again.
    SurveyTemplate:
      type: object
      description: A list of questions a night can send. `platform` is myFiesta's own, which nobody edits.
      required: [id, name, platform, questions, nights_waiting, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: boolean }
        questions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/SurveyQuestion' }
        nights_waiting:
          type: integer
          description: Nights still to be sent with it, so removing it can say what it touches.
        updated_at: { type: [string, 'null'], format: date-time }
    SurveyTemplateInput:
      type: object
      required: [name, questions]
      properties:
        name: { type: string, maxLength: 80 }
        questions:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [type, label]
            properties:
              id:
                type: [string, 'null']
                description: Kept from the question being edited. Left out, a new question is given one.
              type:
                type: string
                enum: [nps, rating5, single, multi, text]
              label: { type: string, maxLength: 200 }
              options:
                type: array
                maxItems: 10
                items: { type: string, maxLength: 80 }
              required: { type: boolean }
    SurveyTemplateList:
      type: object
      required: [data, max_questions, types]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SurveyTemplate' }
        max_questions: { type: integer }
        types:
          type: array
          items: { type: string }
    SurveyTemplateChoice:
      type: object
      required: [id, name, platform]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: boolean }
    EventSurvey:
      type: object
      description: |
        One night's survey as it stands. `stopped_because` says, in the
        organizer's words, why it will not go; null when it will or has.
      required: [enabled, organization_enabled, template_id, template, send_delay_hours, timezone, ends_at, final_count_at, sends_at, sent_at, stopped_because, due_now, can_send_now, questions, templates]
      properties:
        enabled: { type: boolean }
        organization_enabled: { type: boolean }
        template_id:
          type: [string, 'null']
          format: uuid
          description: The survey chosen for this night. Null is myFiesta's own.
        template:
          oneOf:
            - $ref: '#/components/schemas/SurveyTemplateChoice'
            - type: 'null'
        send_delay_hours: { type: integer }
        timezone: { type: string, description: The night's own zone (IANA). }
        ends_at:
          type: string
          format: date-time
          description: The night's end, or twelve hours after it starts when it lists none.
        final_count_at:
          type: string
          format: date-time
          description: When the door's last scans are in, the earliest the survey can be sent.
        sends_at:
          type: string
          format: date-time
          description: The hourly run that sends it, if nothing stops it.
        sent_at: { type: [string, 'null'], format: date-time }
        stopped_because: { type: [string, 'null'] }
        due_now:
          type: boolean
          description: Switched on, the next hourly run sends it.
        can_send_now: { type: boolean }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SurveyQuestion' }
        templates:
          type: array
          description: What can be chosen instead, myFiesta's own first.
          items: { $ref: '#/components/schemas/SurveyTemplateChoice' }
    SurveyOverview:
      type: object
      required: [surveys_enabled, nights_due_now, minimum, recent]
      properties:
        surveys_enabled: { type: boolean }
        nights_due_now:
          type: integer
          description: Finished nights the next hourly run asks about with surveys on.
        minimum:
          type: integer
          description: Answers a night needs before its figures are shown.
        recent:
          type: array
          items:
            type: object
            required: [event_id, title, starts_at, timezone, sent_at, invited, responded, response_rate, nps]
            properties:
              event_id: { type: string, format: uuid }
              title: { type: string }
              starts_at: { type: string, format: date-time }
              timezone: { type: string }
              sent_at: { type: [string, 'null'], format: date-time }
              invited: { type: integer }
              responded: { type: integer }
              response_rate:
                type: [integer, 'null']
                description: Percent of those asked who answered.
              nps:
                type: [integer, 'null']
                description: The recommend score, -100 to 100. Null under `minimum` answers.
    SurveyQuestionResult:
      type: object
      description: |
        One question's figures. `shown` is false until enough people answered
        it, and then `average`, `distribution` and `texts` stay null.
      required: [id, type, label, answered, shown, average, distribution, texts]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [nps, rating5, single, multi, text]
        label: { type: string }
        answered: { type: integer }
        shown: { type: boolean }
        average:
          type: [number, 'null']
          description: For `nps` and `rating5`, to one decimal.
        distribution:
          type: [array, 'null']
          description: Every possible answer with how many gave it, zeros included. Not for `text`.
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
        texts:
          type: [array, 'null']
          description: What was written, newest first, with nothing about who wrote it.
          items: { type: string }
    SurveyInsight:
      type: object
      description: Something the answers suggest doing, by a rule an organizer can check against the figures.
      required: [kind, tone, title, action, tab, word]
      properties:
        kind:
          type: string
          enum: [lowest, change, words]
        tone:
          type: string
          enum: [good, warning, neutral]
        title: { type: string }
        action: { type: string }
        tab:
          type: [string, 'null']
          description: The event tab where the action is taken, when there is one.
        word: { type: [string, 'null'] }
    SurveyResults:
      type: object
      required: [sent_at, invited, responded, response_rate, minimum, enough, nps, questions, insights]
      properties:
        sent_at: { type: [string, 'null'], format: date-time }
        invited: { type: integer }
        responded: { type: integer }
        response_rate: { type: [integer, 'null'] }
        minimum: { type: integer }
        enough:
          type: boolean
          description: Whether `minimum` people have answered. Below it, only the counts are shown.
        nps:
          oneOf:
            - type: object
              required: [score, promoters, passives, detractors, answered]
              properties:
                score: { type: integer, minimum: -100, maximum: 100 }
                promoters: { type: integer }
                passives: { type: integer }
                detractors: { type: integer }
                answered: { type: integer }
            - type: 'null'
        questions:
          type: array
          items: { $ref: '#/components/schemas/SurveyQuestionResult' }
        insights:
          type: array
          items: { $ref: '#/components/schemas/SurveyInsight' }
    # --- track: points ---
    Perk:
      type: object
      description: Something Fiesta Points buy at a night. Filled in by the points feature.
    ClaimedPerk:
      type: object
      description: A perk a ticket's holder claimed. Filled in by the points feature.
    # --- track: pass ---
    # --- track: wait ---
    # --- track: audience ---
