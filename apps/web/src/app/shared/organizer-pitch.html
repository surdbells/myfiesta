<!--
  The other half of the business. Every organizer here arrived as somebody who
  bought a ticket first, and this is the band that turns them.

  The headline is the fee model, because it is genuinely the strongest thing
  we can say: the service charge is added for the buyer, so the ticket price
  an organizer sets is the amount they are paid. Most of the market deducts
  theirs.
-->
<section
  class="pitch mt-24 bg-[linear-gradient(135deg,var(--color-brand-800)_0%,var(--color-brand-900)_45%,var(--color-neutral-950)_100%)] px-6 py-24 text-neutral-0"
>
  <div class="pitch__inner mx-auto grid max-w-[1240px] justify-items-center gap-6 text-center">
    <p class="pitch__eyebrow text-sm font-semibold uppercase tracking-[0.08em] text-gold-300">Run events?</p>
    <h2 class="pitch__title text-balance text-[clamp(1.75rem,4vw,2.75rem)] font-bold leading-[1.15] tracking-[-0.02em]">
      Set the price. Keep the price.
    </h2>
    <p class="pitch__body max-w-[52ch] text-pretty text-lg leading-[1.6] text-neutral-200">
      Our 8% service charge is added at checkout and paid by the buyer. A $50
      ticket pays you $50 — we never take a cut of what you set, and there is
      nothing to pay to list.
    </p>

    <div class="pitch__actions mt-2 flex flex-wrap items-center justify-center gap-6">
      <!-- Gold on the green ground: the brand's second colour, and the only
           place on the page it carries an action. -->
      <a
        class="pitch__cta rounded-full bg-gold-400 px-8 py-3 font-semibold text-neutral-950 no-underline hover:bg-gold-300"
        [href]="consoleUrl + '/register'"
        >Start selling</a
      >
      <a
        class="pitch__secondary text-sm text-neutral-200 underline underline-offset-[3px] hover:text-neutral-0"
        [href]="consoleUrl"
        >I already have an account</a
      >
    </div>
  </div>
</section>
