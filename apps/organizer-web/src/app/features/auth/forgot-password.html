<main class="shell">
  @if (sent()) {
    <div class="card">
      <h1>Check your email</h1>
      <p class="sub">
        If that address has an account, a link to set a new password is on its
        way. It expires in an hour.
      </p>
      <a class="back-link" routerLink="/sign-in">Back to sign in</a>
    </div>
  } @else {
    <form class="card" (ngSubmit)="submit()">
      <h1>Forgotten password</h1>
      <p class="sub">We will email you a link to set a new one.</p>

      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        inputmode="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />

      <button type="submit" [disabled]="busy()">
        @if (busy()) {
          Sending…
        } @else {
          Send the link
        }
      </button>

      <p class="alt"><a routerLink="/sign-in">Back to sign in</a></p>
    </form>
  }
</main>
