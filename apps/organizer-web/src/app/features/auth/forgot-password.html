<main class="shell grid min-h-dvh place-items-center bg-surface-sunken p-6 max-[420px]:items-start max-[420px]:p-0">
  @if (sent()) {
    <div class="card grid w-full max-w-[26rem] gap-4 rounded-xl border border-border bg-surface-raised p-8 shadow-(--shadow-raised) max-[420px]:min-h-dvh max-[420px]:max-w-none max-[420px]:content-start max-[420px]:rounded-none max-[420px]:border-0 max-[420px]:pt-12 max-[420px]:shadow-none">
      <header class="card__head mb-1 grid gap-1">
        <h1 class="text-2xl font-semibold tracking-[-0.02em]">Check your email</h1>
        <p class="sub text-pretty text-sm text-text-muted">
          If that address has an account, a link to set a new password is on its
          way. It expires in an hour.
        </p>
      </header>
      <a uiButton variant="secondary" routerLink="/sign-in">Back to sign in</a>
    </div>
  } @else {
    <form class="card grid w-full max-w-[26rem] gap-4 rounded-xl border border-border bg-surface-raised p-8 shadow-(--shadow-raised) max-[420px]:min-h-dvh max-[420px]:max-w-none max-[420px]:content-start max-[420px]:rounded-none max-[420px]:border-0 max-[420px]:pt-12 max-[420px]:shadow-none" (ngSubmit)="submit()">
      <header class="card__head mb-1 grid gap-1">
        <h1 class="text-2xl font-semibold tracking-[-0.02em]">Forgotten password</h1>
        <p class="sub text-pretty text-sm text-text-muted">We will email you a link to set a new one.</p>
      </header>

      @if (error(); as message) {
        <ui-alert tone="danger">{{ message }}</ui-alert>
      }

      <ui-field label="Email" required>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </ui-field>

      <button uiButton type="submit" size="lg" [loading]="busy()" [disabled]="busy()">
        @if (busy()) { Sending… } @else { Send the link }
      </button>

      <p class="alt text-center text-sm text-text-muted"><a class="text-primary-text" routerLink="/sign-in">Back to sign in</a></p>
    </form>
  }
</main>
