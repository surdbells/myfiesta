<main class="shell">
  @if (sent()) {
    <div class="card">
      <header class="card__head">
        <h1>Check your email</h1>
        <p class="sub">
          If that address has an account, a link to set a new password is on its
          way. It expires in an hour.
        </p>
      </header>
      <a uiButton variant="secondary" routerLink="/sign-in">Back to sign in</a>
    </div>
  } @else {
    <form class="card" (ngSubmit)="submit()">
      <header class="card__head">
        <h1>Forgotten password</h1>
        <p class="sub">We will email you a link to set a new one.</p>
      </header>

      @if (error(); as message) {
        <ui-alert tone="danger">{{ message }}</ui-alert>
      }

      <ui-field label="Email" required>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </ui-field>

      <button uiButton type="submit" size="lg" [loading]="busy()" [disabled]="busy()">
        @if (busy()) { Sending… } @else { Send the link }
      </button>

      <p class="alt"><a routerLink="/sign-in">Back to sign in</a></p>
    </form>
  }
</main>
