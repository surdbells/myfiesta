<app-auth-stage>
  <form class="card grid w-full max-w-[26rem] gap-4 rounded-(--radius-card) border border-border-subtle bg-surface-raised p-8 shadow-(--shadow-raised) max-[420px]:min-h-dvh max-[420px]:max-w-none max-[420px]:content-start max-[420px]:rounded-none max-[420px]:border-0 max-[420px]:pt-12 max-[420px]:shadow-none" (ngSubmit)="submit()">
    <header class="card__head mb-1 grid gap-1">
      <h1 class="text-2xl font-semibold tracking-[-0.02em]">myfiesta</h1>
      <p class="sub text-pretty text-sm text-text-muted">Organizer console</p>
    </header>

    @if (error(); as message) {
      <ui-alert tone="danger">{{ message }}</ui-alert>
    }

    <ui-field label="Email" required>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        inputmode="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </ui-field>

    <ui-field label="Password" required>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </ui-field>

    <button uiButton type="submit" size="lg" [block]="true" [loading]="busy()" [disabled]="busy()">
      @if (busy()) { Signing in… } @else { Sign in }
    </button>

    <p class="alt text-center text-sm text-text-muted"><a class="text-primary-text" routerLink="/forgot-password">Forgotten your password?</a></p>
    <p class="alt text-center text-sm text-text-muted -mt-3">New here? <a class="text-primary-text" routerLink="/register">Create an account</a></p>
  </form>
</app-auth-stage>
