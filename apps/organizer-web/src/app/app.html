@if (session.signedIn()) {
  <header class="chrome">
    <span class="brand">myFiesta</span>

    <div class="who">
      @if (session.current(); as org) {
        <span class="org">{{ org.name }}</span>
        <span class="role">{{ org.role }}</span>
      }
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>
}

<main class="page">
  <router-outlet />
</main>
